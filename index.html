    .round-source { margin-left: 8px; padding: 3px 10px; border-radius: 999px; background: var(--wd-soft); color: oklch(0.4 0.12 355); font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; }
    .round-breakdown { border-top: none; display: flex; flex-direction: column; gap: 6px; }
    .round-breakdown li { border: none; border-radius: 14px; padding: 10px 14px; background: var(--wd-soft); }
    .option { font-family: var(--wd-body); font-size: 15px; font-weight: 600; padding: 16px 18px; border-radius: 18px; border: 1.5px solid var(--wd-border); background: #fff; transition: transform 0.2s, border-color var(--speed), background var(--speed); }
    .option:hover:not(:disabled) { border-color: var(--accent); background: #fff; transform: translateY(-2px); }
    .option.is-correct { background: oklch(0.93 0.06 160); border-color: oklch(0.6 0.1 160); color: var(--wd-ink); }
    .option.is-wrong { background: oklch(0.93 0.05 20); border-color: oklch(0.6 0.15 20); color: var(--wd-ink); }
    .option.is-dimmed { opacity: 0.5; }
    .options.two-up .option { font-size: 16px; text-transform: none; letter-spacing: 0; }
    .text-answer input { padding: 14px 18px; border: 1.5px solid oklch(0.88 0.05 355); border-radius: 999px; background: #fff; }
    .text-answer input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px oklch(0.55 0.19 358 / 0.15); }
    .feedback { border: none; border-radius: 20px; padding: 18px 20px; }
    .feedback.good { background: oklch(0.95 0.04 160); color: oklch(0.42 0.1 160); }
    .feedback.bad { background: oklch(0.95 0.03 20); color: oklch(0.5 0.15 20); }
    .game .feedback strong { font-family: var(--wd-body); font-size: 16px; font-weight: 700; }
    .feedback p { color: var(--wd-ink); }
    .badge { background: var(--accent); color: #fff; border: none; box-shadow: 0 0 0 8px #fffafc, 0 0 0 10px var(--wd-soft); }
    .game .badge-name { font-family: var(--wd-display); font-weight: 400; font-size: 44px; line-height: 1; color: var(--wd-ink); }
    .game .big-score { font-family: var(--wd-display); font-weight: 400; font-size: 64px; color: var(--accent); }
    .takeaway { border: none; border-radius: 20px; padding: 18px 22px; background: var(--wd-butter); }
    .takeaway strong { font-size: 14px; font-weight: 700; text-transform: none; letter-spacing: 0; color: oklch(0.35 0.07 60); }
    .game .takeaway p { font-family: var(--wd-body); font-style: normal; font-size: 16px; line-height: 1.6; color: oklch(0.35 0.07 60); }

    /* Pinkle */
    .game h2.pinkle-title { font-family: var(--wd-display); font-weight: 400; }
    .pinkle-title span { color: var(--accent); }
    .wg-tile { border-radius: 12px; border: 2px solid var(--wd-border); background: #fff; font-family: var(--wd-body); font-weight: 700; color: var(--wd-ink); }
    .wg-tile.filled { border-color: oklch(0.7 0.08 355); }
    .correct { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; }
    .present { background: var(--wd-butter2) !important; border-color: var(--wd-butter2) !important; color: oklch(0.3 0.07 60) !important; }
    .absent  { background: oklch(0.72 0.03 355) !important; border-color: oklch(0.72 0.03 355) !important; color: #fff !important; }
    .wg-message { color: oklch(0.45 0.1 355); font-weight: 600; }
    .wg-key { height: 50px; border-radius: 10px; background: oklch(0.92 0.05 355); color: var(--wd-ink); font-family: var(--wd-body); font-weight: 700; }
    .wg-key:hover:not(:disabled) { background: oklch(0.88 0.06 355); }
    .wg-key.wide { letter-spacing: 0; }
    .wg-stats, .pk-dist-title, .pk-numbers span { text-transform: none; letter-spacing: 0; font-weight: 600; color: oklch(0.45 0.08 355); }
    .wg-stats { font-size: 13px; }
    .pk-bar { background: oklch(0.72 0.03 355); }
    .pk-bar.hit { background: var(--accent); }

    /* Hangman */
    .hm-base { stroke: var(--wd-ink); }
    .hm-part { stroke: var(--accent); }
    .hm-hint { display: inline-block; padding: 6px 12px; border-radius: 999px; background: var(--wd-soft); color: oklch(0.4 0.12 355); font-size: 13px; font-weight: 600; text-transform: none; letter-spacing: 0; }
    .hm-slot { border-bottom: 3px solid var(--wd-ink); font-family: var(--wd-display); font-weight: 400; font-size: clamp(26px, 4vw, 36px); line-height: 1; }
    .hm-slot.missed { color: var(--accent); }

    /* Akinator */
    .ak-lamp svg { stroke: var(--accent); }
    @keyframes ak-glow { 50% { filter: drop-shadow(0 0 6px oklch(0.55 0.19 358 / 0.5)); transform: translateY(-3px); } }
    .ak-bubble { padding: 16px 20px; border: none; border-radius: 22px 22px 22px 6px; background: var(--wd-ink); color: #fff; }
    .ak-bubble::before { display: none; }
    .ak-label { font-size: 13px; font-weight: 700; text-transform: none; letter-spacing: 0; color: oklch(0.45 0.08 355); }
    .ak-q { padding: 12px 16px; border: 1.5px solid var(--wd-border); border-radius: 16px; background: #fff; font-family: var(--wd-body); font-size: 14px; }
    .ak-q:hover:not(:disabled) { border-color: var(--accent); background: var(--wd-hover); }
    .ak-q.yes { border-color: oklch(0.6 0.1 160); }
    .ak-answer { font-size: 12px; text-transform: none; letter-spacing: 0; }
    .ak-q.yes .ak-answer, .ak-log li.yes b { color: oklch(0.45 0.12 160); }
    .ak-q.no .ak-answer { color: var(--accent); }
    .ak-card { border-radius: 14px; border: 1.5px solid transparent; font-family: var(--wd-body); font-weight: 600; }
    .ak-card:nth-child(3n+1) { background: oklch(0.94 0.04 355); }
    .ak-card:nth-child(3n+2) { background: oklch(0.94 0.04 40); }
    .ak-card:nth-child(3n)   { background: oklch(0.94 0.04 320); }
    .ak-card:hover { border-color: var(--accent); }
    .ak-card.wrong-guess { background: oklch(0.93 0.05 20); border-color: oklch(0.6 0.15 20); }
    .ak-card.secret { background: oklch(0.93 0.06 160); border-color: oklch(0.6 0.1 160); color: var(--wd-ink); }
    .guess-mode .ak-card:not(.crossed) { border-color: var(--accent); box-shadow: none; }
    .guess-mode .ak-board-head .ak-label { color: var(--accent); }

    /* ---------- How I built it ---------- */
    .step-tiles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; }
    .step-tile { display: flex; flex-direction: column; gap: 12px; padding: 28px; border-radius: 28px; }
    .step-tile .num { font-family: var(--wd-display); font-size: 54px; line-height: 1; color: var(--accent); }
    .step-tile strong { font-family: var(--wd-display); font-weight: 400; font-size: 28px; line-height: 1.1; }
    .step-tile .txt { font-size: 15px; line-height: 1.55; color: oklch(0.4 0.07 355); }
    .design-choices { grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px; margin: 22px 0; }
    .design-choices > div { border: none; padding: 18px; border-radius: 20px; background: oklch(0.94 0.04 355); }
    .design-choices strong { font-size: 15px; font-weight: 700; }
    .design-choices p { margin: 6px 0 0; font-size: 14px; line-height: 1.5; color: oklch(0.4 0.07 355); }
    .feature-pills { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .feature-pills li { font-size: 13px; font-weight: 600; padding: 7px 13px; border-radius: 999px; background: var(--wd-butter); color: oklch(0.35 0.07 60); }
    .journey-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }

/* =================================================================
   6. HELPERS
   ================================================================= */

// Creates an HTML element with an optional class and text
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

// Creates a white card with an optional title and intro line
function makeCard(title, intro) {
  const card = el("section", "card");
  if (title) card.append(el("h3", "", title));
  if (intro) card.append(el("p", "card-intro", intro));
  return card;
}

// Creates a link that looks like a button
function linkButton(text, href, primary, newTab) {
  const a = el("a", primary ? "btn btn-primary" : "btn", text);
  a.href = href;
  if (newTab) { a.target = "_blank"; a.rel = "noopener"; }
  return a;
}

// Creates <ul class="chips"> from an array of words
function chips(words) {
  const ul = el("ul", "chips");
  words.forEach(w => ul.append(el("li", "", w)));
  return ul;
}

// "2026-10-03" → "3 Oct 2026"; "" → "Date TBC"
function formatDate(iso) {
  if (!iso) return "Date TBC";
  return new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}

// Shows a small pop-up message at the bottom of the screen for 2 seconds
function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove("show"), 2000);
}


/* =================================================================
   7. LECTURE SECTION RENDERERS
   -----------------------------------------------------------------
   One function per section type. Each receives the section data and
   returns a finished card element.
   ================================================================= */

/* ---- "cards": click to open/close ---- */
function renderCards(section) {
  const card = makeCard(section.title, section.intro);

  // Header row: titles on the left, "Open all" button on the right
  const head = el("div", "card-head");
  const titles = el("div");
  titles.append(...card.childNodes);
  const allBtn = el("button", "btn", "Open all");
  allBtn.setAttribute("aria-pressed", "false");
  head.append(titles, allBtn);
  card.append(head);

  const grid = el("div", "concepts");
  const toggles = [];

  section.items.forEach((item, i) => {
    const box = el("div", "concept");
    const toggle = el("button", "concept-toggle");
    toggle.setAttribute("aria-expanded", "false");
    toggle.append(el("span", "", (i + 1) + ". " + item.name), el("span", "icon", "+"));

    const body = el("div", "concept-body");
    body.hidden = true;
    // section.label (optional) is a bold word shown before the detail, e.g. "Example: "
    if (section.label) body.append(el("strong", "", section.label));
    body.append(document.createTextNode(item.detail));

    // EVENT LISTENER: clicking a card flips it open/closed.
    // aria-expanded tells screen readers whether it's open.
    toggle.addEventListener("click", () => {
      const isOpen = toggle.getAttribute("aria-expanded") === "true";
      toggle.setAttribute("aria-expanded", String(!isOpen));
      body.hidden = isOpen;
    });

    box.append(toggle, body);
    grid.append(box);
    toggles.push(toggle);
  });

  allBtn.addEventListener("click", () => {
    const openAll = allBtn.getAttribute("aria-pressed") === "false";
    toggles.forEach(t => {
      t.setAttribute("aria-expanded", String(openAll));
      t.nextElementSibling.hidden = !openAll;
    });
    allBtn.setAttribute("aria-pressed", String(openAll));
    allBtn.textContent = openAll ? "Close all" : "Open all";
  });

  card.append(grid);
  return card;
}

/* ---- "stats": numbers that count up ---- */
function renderStats(section) {
  const card = makeCard(section.title, section.intro);
  const grid = el("div", "stats");

  section.items.forEach(item => {
    const box = el("div", "stat");
    const number = el("div", "stat-number");
    // Save the stat on the element so countUp() can find it later
    number.dataset.value = item.value;
    number.dataset.decimals = item.decimals || 0;
    number.dataset.prefix = item.prefix || "";
    number.dataset.suffix = item.suffix || "";
    number.textContent = formatStat(item.value, item);
    box.append(number, el("div", "stat-label", item.label));
    if (item.note) box.append(el("div", "stat-note", item.note));
    grid.append(box);
  });

  card.append(grid);
  return card;
}

function formatStat(n, opts) {
  const d = Number(opts.decimals || 0);
  // toLocaleString adds thousands separators: 15505 → "15,505"
  const number = Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  return (opts.prefix || "") + number + (opts.suffix || "");
}

// Animates every .stat-number inside an element from 0 to its value
function countUp(container) {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  container.querySelectorAll(".stat-number").forEach(node => {
    const d = node.dataset;
    const target = Number(d.value);
    const start = performance.now();
    const duration = 900;  // milliseconds

    // requestAnimationFrame runs this function on every screen refresh
    function frame(now) {
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);   // slows down at the end
      node.textContent = formatStat(target * eased,
        { prefix: d.prefix, suffix: d.suffix, decimals: Number(d.decimals) });
      if (progress < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

/* ---- "compare": Before / After switch ---- */
function renderCompare(section) {
  const card = makeCard(section.title, section.intro);

  const switcher = el("div", "switch");
  switcher.setAttribute("role", "group");
  switcher.setAttribute("aria-label", "Choose a view");
  const list = el("ul", "compare-list");
  list.setAttribute("aria-live", "polite");

  // Redraws the list for "before" or "after"
  function show(view) {
    list.innerHTML = "";
    list.className = "compare-list " + view;
    section.items.forEach((item, i) => {
      const li = el("li");
      li.style.animationDelay = i * 60 + "ms";   // items appear one after another
      li.append(el("span", "", item.topic), document.createTextNode(item[view]));
      list.append(li);
    });
    buttons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  }

  const buttons = ["before", "after"].map((view, i) => {
    const b = el("button", "btn", section.labels[i]);
    b.dataset.view = view;
    // EVENT LISTENER: each switch button shows its view
    b.addEventListener("click", () => show(view));
    switcher.append(b);
    return b;
  });

  const box = el("div", "compare-box");
  box.append(switcher, list);
  card.append(box);
  show("before");
  return card;
}

/* ---- "analysis": your own writing ---- */
function renderAnalysis(section) {
  // Only the blocks I've actually written are shown. Empty ones stay hidden,
  // so the public site never shows unfinished placeholders. If nothing is
  // written yet, the whole card is skipped (return null).
  const written = section.blocks.filter(block => block.text.length);

  const card = makeCard(section.title);

    wrap.append(el("h4", "", block.heading));
    block.text.forEach(paragraph => wrap.append(el("p", "", paragraph)));

}

/* ---- "people": guest speaker cards ---- */
function renderPeople(section) {

/* ---- "gallery": photos that open bigger when clicked ----
   One shared <dialog> element is used as the "lightbox".
   dialog.showModal() opens it on top of the page; Esc or the
   close button closes it, and focus returns to the photo. */
function renderGallery(section) {
  const card = makeCard(section.title, section.intro);
  const grid = el("div", "gallery");
  section.items.forEach(item => {
    const figure = el("figure");
    const button = el("button", "gallery-open");
    button.setAttribute("aria-label", "Enlarge photo: " + item.caption);
    const img = el("img");
    img.src = item.src;
    img.alt = item.alt;
    img.loading = "lazy";
    button.append(img);
    // EVENT LISTENER: clicking a photo opens it in the lightbox
    button.addEventListener("click", () => openLightbox(item, section.source));
    figure.append(button, el("figcaption", "", item.caption));
    grid.append(figure);
  });
  card.append(grid);
  if (section.source) card.append(sourceLine(section.source));
  return card;
}

function openLightbox(item, source) {
  let dialog = document.getElementById("lightbox");
  if (!dialog) {                     // build it the first time it's needed
    dialog = el("dialog", "lightbox");
    dialog.id = "lightbox";
    const close = el("button", "btn lightbox-close", "Close");
    close.addEventListener("click", () => dialog.close());
    // Clicking the dark area around the photo also closes it
    dialog.addEventListener("click", (event) => { if (event.target === dialog) dialog.close(); });
    dialog.append(close, el("img"), el("p", "lightbox-caption"));
    document.body.append(dialog);
  }
  const img = dialog.querySelector("img");
  img.src = item.src;
  img.alt = item.alt;
  const caption = dialog.querySelector(".lightbox-caption");
  caption.textContent = item.caption;
  if (source) caption.append(document.createTextNode(" · "), sourceLine(source).lastChild);
  dialog.showModal();
}

function tint(i) { return "tint-" + (i % 3); }

// My photo in an arch, with three bobbing stickers that change words
// and my signature. Used on the About page.
function archPortrait(src) {
  const portrait = el("div", "wd-portrait");
  const photo = el("img");
  photo.src = src;
  photo.alt = "Portrait of " + PROFILE.name;
  portrait.append(el("div", "wd-arch-bg"), photo);
  const stickers = HOME.heroStickers.map((words, i) => {
    const s = el("span", "wd-sticker s" + i, words[0]);
    portrait.append(s);
    return s;
  });
  const sig = el("span", "signature wd-signature", "Zoé");
  sig.setAttribute("aria-hidden", "true");
  portrait.append(sig);

  // Every 2.6s one sticker (taking turns) fades out, swaps its word, fades back in.
  // Only the text changes, so the bobbing animation never restarts.
  let tick = 0;
  setInterval(() => {
    if (portrait.offsetParent === null) return;          // page not visible: skip
    tick++;
    const i = tick % 3;
    const words = HOME.heroStickers[i];
    const next = words[Math.floor(tick / 3 + 1) % words.length];
    stickers[i].animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: "forwards" }).onfinish = () => {
      stickers[i].textContent = next;
      stickers[i].animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: "forwards" });
    };
  }, 2600);
  return portrait;
}

  page.append(journey);
}

/* ---------- Reusable sub-tabs ----------
   Used by both the Sessions page and the Games page.
   How the sub-tabs work:
   1. One <button role="tab"> and one panel per entry.
   2. Clicking a tab changes the URL to "#<page>/<number>", and the
      navigation code (section 10) then calls select(index).
   3. select() sets aria-selected on that tab and removes "hidden"
      from its panel; the other panels get "hidden".
   4. Arrow keys / Home / End move between tabs.
   options = { page, hashName, label, entries, tabLabel(entry), isSoon(entry), render(panel, entry), onSelect(panel),
               idPrefix (optional: keeps ids unique when a page has two tab sets),
               hashNumber(entry, index) (optional: the number written in the URL, default index + 1) } */
function createTabSet(options) {
  const tabs = [];
  const panels = [];
  const tablist = el("div", "tablist");
  tablist.setAttribute("role", "tablist");
  tablist.setAttribute("aria-label", options.label);
  const panelsBox = el("div");
  options.page.append(tablist, panelsBox);

  const prefix = options.idPrefix || options.hashName;
  const hashNumber = options.hashNumber || ((entry, index) => index + 1);

  options.entries.forEach((entry, index) => {
    const id = prefix + "-" + index;                // e.g. "games-0"
    const tab = el("button", "tab", options.tabLabel(entry));
    tab.id = "tab-" + id;
    tab.setAttribute("role", "tab");
    tab.setAttribute("aria-controls", "panel-" + id);
    if (options.isSoon && options.isSoon(entry)) tab.append(el("span", "tab-soon", " · soon"));
    // EVENT LISTENER: clicking the tab updates the URL, which opens the panel
    tab.addEventListener("click", () => { location.hash = options.hashName + "/" + hashNumber(entry, index); });
    tablist.append(tab);
    tabs.push(tab);

    const panel = el("div", "panel");
    panel.id = "panel-" + id;
    panel.setAttribute("role", "tabpanel");
    panel.setAttribute("aria-labelledby", tab.id);
    panelsBox.append(panel);
    panels.push(panel);
    options.render(panel, entry);
  });

  tablist.addEventListener("keydown", (event) => {
    const current = tabs.indexOf(document.activeElement);
    if (current === -1) return;
    let next = null;
    if (event.key === "ArrowRight") next = (current + 1) % tabs.length;
    if (event.key === "ArrowLeft")  next = (current - 1 + tabs.length) % tabs.length;
    if (event.key === "Home") next = 0;
    if (event.key === "End")  next = tabs.length - 1;
    if (next !== null) {
      event.preventDefault();
      location.hash = options.hashName + "/" + hashNumber(options.entries[next], next);
      tabs[next].focus();
    }
  });

  return {
    count: tabs.length,
    select(index) {
      tabs.forEach((tab, i) => {
        const isActive = i === index;
        tab.setAttribute("aria-selected", String(isActive));
        tab.tabIndex = isActive ? 0 : -1;   // only the active tab is in the Tab-key order
        panels[i].hidden = !isActive;
      });
      if (options.onSelect) options.onSelect(panels[index]);
    }
  };
}

// Pages that have sub-tabs register them here, e.g. TABSETS.lectures
const TABSETS = {};

/* ---------- Reusable "big tabs + small tabs" ----------
   Used by the Sessions page (Lectures / Guest lectures) and the Games
   page (Quizzes / Pinkle / Hangman / Akinator).
   Level 1: one big tab per group.
   Level 2: inside a group with several entries, a row of small tabs
            (createTabSet). A group with ONE entry shows it directly.
   The URL always uses the entry's position in the full list (allEntries),
   so "#games/5" opens the 5th game wherever it is, and links from other
   pages keep working. select() works out which group to show.
   options = { page, hashName, label, allEntries, groups: [{ key, label, note, entries }],
               tabLabel(entry), isSoon(entry), render(panel, entry), onSelect(panel) } */
function createGroupedTabs(options) {
  const { page, hashName, allEntries } = options;
  const number = entry => allEntries.indexOf(entry) + 1;      // the number in the URL

  const groupBar = el("div", "group-tabs");
  groupBar.style.setProperty("--groups", options.groups.length);
  groupBar.setAttribute("role", "tablist");
  groupBar.setAttribute("aria-label", options.label);
  page.append(groupBar);

  const groups = options.groups.map(group => {
    // The big tab
    const tab = el("button", "group-tab");
    tab.id = hashName + "-group-tab-" + group.key;
    tab.setAttribute("role", "tab");
    tab.setAttribute("aria-controls", hashName + "-group-" + group.key);
    tab.append(el("span", "group-name", group.label), el("span", "group-note", group.note));
    // EVENT LISTENER: opening a group shows its first entry
    tab.addEventListener("click", () => { location.hash = hashName + "/" + number(group.entries[0]); });
    groupBar.append(tab);

    // The group's own area
    const area = el("div", "group-panel");
    area.id = hashName + "-group-" + group.key;
    area.setAttribute("role", "tabpanel");
    area.setAttribute("aria-labelledby", tab.id);
    page.append(area);

    let tabSet = null;
    if (group.entries.length > 1) {
      // Several entries → a row of small tabs
      tabSet = createTabSet({
        page: area,
        hashName,
        idPrefix: hashName + "-" + group.key,
        label: group.label,
        entries: group.entries,
        hashNumber: entry => number(entry),
        tabLabel: options.tabLabel,
        isSoon: options.isSoon,
        render: options.render,
        onSelect: options.onSelect
      });
    } else {
      // One entry → show it straight away, no small tabs
      const panel = el("div", "panel");
      area.append(panel);
      options.render(panel, group.entries[0]);
    }
    return { tab, area, entries: group.entries, tabSet };
  });

  // Arrow keys move between the big tabs
  groupBar.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
    event.preventDefault();
    const current = groups.findIndex(g => g.tab === document.activeElement);
    const step = event.key === "ArrowRight" ? 1 : groups.length - 1;
    const next = groups[(current + step) % groups.length];
    location.hash = hashName + "/" + number(next.entries[0]);
    next.tab.focus();
  });

  return {
    count: allEntries.length,
    // "#games" on its own opens the first group's first entry
    defaultIndex: allEntries.indexOf(groups[0].entries[0]),
    select(index) {
      const entry = allEntries[index];
      groups.forEach(g => {
        const isActive = g.entries.includes(entry);
        g.tab.setAttribute("aria-selected", String(isActive));
        g.tab.tabIndex = isActive ? 0 : -1;
        g.area.hidden = !isActive;
        if (!isActive) return;
        if (g.tabSet) g.tabSet.select(g.entries.indexOf(entry));
        else if (options.onSelect) options.onSelect(g.area);
      });
    }
  };
}

/* ---------- Sessions & schedule ----------
   Every session as a small card in date order (the schedule). The cards
   work like tabs: "#lectures/N" selects SESSIONS[N-1], its card turns ink
   and its notes appear below. Guest lectures pop in raspberry. */
function buildLectures(page) {
  page.append(subTabs("course", "lectures"));
  const intro = el("section", "pg-intro");
  intro.append(pageHead(page, ["✦ Sessions & schedule"], "The semester, ", "session by session"),
               el("p", "pg-lead", "Every lecture and guest lecture in date order. Pick one to read my notes below."));
  page.append(intro);

  const today = new Date().toISOString().slice(0, 10);   // "YYYY-MM-DD"
  const grid = el("ol", "sess-grid");
  grid.setAttribute("aria-label", "All sessions, in date order");
  const panels = el("div");
  page.append(grid, panels);

  // Sort by date (sessions without a date go last), keeping each session's
  // position in SESSIONS so its link opens the right notes
  const ordered = SESSIONS
    .map((s, index) => ({ s, index }))
    .sort((a, b) => (a.s.date || "9999").localeCompare(b.s.date || "9999"));

  const cards = [], boxes = [];
  ordered.forEach(({ s, index }, k) => {
    const done = s.date !== "" && s.date <= today;   // today or in the past
    const guest = s.kind === "guest";
    const li = el("li");
    const a = el("a", "sess-card" + (guest ? " guest" : ""));
    a.href = "#lectures/" + (index + 1);
    a.style.setProperty("--tint", "oklch(0.94 0.045 " + Math.round((355 + k * 47) % 360) + ")");   // each card its own tint
    const date = el("div", "sess-date");
    if (s.date) {
      const d = new Date(s.date + "T00:00:00");
      date.append(el("span", "sess-day", String(d.getDate())),
                  el("span", "sess-month", d.toLocaleDateString("en-GB", { month: "short", year: "numeric" })));
    } else {
      date.append(el("span", "sess-day", "TBA"), el("span", "sess-month", "date to come"));
    }
    const status = guest ? ["reflection", "My reflection"] : done ? ["done", "✓ Done"] : s.date ? ["upcoming", "Upcoming"] : ["tbc", "Coming soon"];
    const top = el("div", "sess-top");
    top.append(el("span", "sess-label", (guest ? "★ " : "") + s.tabLabel), el("span", "sess-status " + status[0], status[1]));
    const info = el("div", "sess-info");
    info.append(top, el("strong", "sess-title", s.title));
    a.append(date, info);
    li.append(a);
    grid.append(li);
    cards[index] = a;
  });

  SESSIONS.forEach((s, index) => {
    const panel = el("section", "panel");
    panel.setAttribute("aria-label", s.tabLabel + ": " + s.title);
    panel.hidden = true;
    s.data ? renderLecture(panel, s) : renderComingSoon(panel, s);
    panels.append(panel);
    boxes[index] = panel;
  });

  TABSETS.lectures = {
    count: SESSIONS.length,
    select(index) {
      SESSIONS.forEach((s, i) => {
        cards[i].classList.toggle("on", i === index);
        if (i === index) cards[i].setAttribute("aria-current", "true");
        else cards[i].removeAttribute("aria-current");
        boxes[i].hidden = i !== index;
      });
      countUp(boxes[index]);        // replay the number animation
    }
  };
}

// "Guest lecture · 9 October 2026"
function sessionMeta(session) {
  const kind = session.kind === "guest" ? "Guest lecture" : "Lecture";
  if (!session.date) return kind + " · " + session.tabLabel;
  return kind + " · " + new Date(session.date + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
}

function renderLecture(panel, session) {
  const intro = el("section", "card lecture-head");
  intro.append(el("span", "eyebrow", sessionMeta(session)), el("h2", "", session.title),
               el("span", "lecture-speaker", session.speaker), el("p", "pg-lead", session.data.summary));

  // If this session has a game, add a button to play it
  // Buttons to every game theme that uses questions from this session
  const themes = GAMES.filter(g => g.rounds && g.rounds.some(r => r.session === session));
  if (themes.length) {
    const row = el("div", "btn-row");
    themes.forEach(g => row.append(linkButton("Play: " + g.tabLabel, "#games/" + (GAMES.indexOf(g) + 1), true)));
    intro.append(row);
  }
  panel.append(intro);

  session.data.sections.forEach(section => {
    const render = RENDERERS[section.type];
    if (!render) return console.warn("Unknown section type:", section.type);
    const node = render(section);
    if (!node) return;
    if (section.type !== "quote") node.classList.add("lecture-sec");   // sections sit straight on the page
    panel.append(node);              // a renderer may return nothing (e.g. empty analysis)
  });

  // GUEST SESSIONS: the game made only of this session's questions is
  // played right here, at the bottom of the tab (the assignment brief:
  // "each tab containing an interactive game"). It's automatic: any quiz
  // theme whose rounds ALL come from this session is embedded.
  // createGame() keeps its state inside, so this copy has its own score,
  // separate from the same game on the Games page.
  if (session.kind === "guest") {
    GAMES.filter(g => g.rounds && g.rounds.every(r => r.session === session)).forEach(game => {
      const wrap = el("section", "embedded-game");
      const head = el("div", "embedded-head");
      head.append(el("span", "eyebrow", "Interactive game"), el("h3", "", "Play: test what you learned"));
      const gameBox = el("div");
      wrap.append(head, gameBox);
      panel.append(wrap);
      createGame(gameBox, game);
    });
  }
}

function renderComingSoon(panel, session) {
  const card = el("section", "card lecture-head soon");
  card.append(
    el("span", "eyebrow", sessionMeta(session)),
    el("h2", "", session.title),
    el("span", "lecture-speaker", session.speaker),
    el("p", "soon-note", "Notes coming soon ✿")
  );
  const dots = el("div", "soon-dots");
  dots.setAttribute("aria-hidden", "true");
  dots.append(el("span"), el("span"), el("span"));
  card.append(dots);
  panel.append(card);
}

/* ---------- Games ---------- */
/* ---------- Player profiles, saved scores and leaderboard ----------
   Everything is stored in this browser (localStorage), so the board only
   covers profiles made on this device. The PIN hash is NOT secure: it
   only stops someone casually signing in as another player.
     zc-profiles            → { [name in lower case]: { name, pin, created } }
     zc-player              → the current player's name
     zc-games-v1:<name>     → that player's results per game: { played, wins, best }
     zc-games-v1            → results while playing as a guest */
const SAVE_KEY = "zc-games-v1", PROFILES_KEY = "zc-profiles", PLAYER_KEY = "zc-player";
function lsGet(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; } }
function lsSet(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
const saveKeyFor = name => name ? SAVE_KEY + ":" + name.toLowerCase() : SAVE_KEY;
const hashPin = pin => Array.from(pin + "zc").reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7).toString(36);
const sumOf = (list, field) => list.reduce((total, v) => total + (v[field] || 0), 0);

const players = {
  current: lsGet(PLAYER_KEY, null),
  listeners: [],                     // redraw functions (profile bar, leaderboard)
  save(name = this.current) { return lsGet(saveKeyFor(name), {}); },
  // Called by every game when a round ends: quizzes pass their score
  record(game, won, score) {
    const all = this.save();
    const entry = all[game.tabLabel] || { kind: game.kind || "quiz" };
    entry.played = (entry.played || 0) + 1;
    if (won) entry.wins = (entry.wins || 0) + 1;
    if (score != null) entry.best = Math.max(entry.best || 0, score);
    all[game.tabLabel] = entry;
    lsSet(saveKeyFor(this.current), all);
    this.changed();
  },
  // Switches the save: from now on results go to this player's key (null = guest)
  login(name) {
    this.current = name;
    if (name) lsSet(PLAYER_KEY, name);
    else { try { localStorage.removeItem(PLAYER_KEY); } catch {} }
    this.changed();
  },
  changed() { this.listeners.forEach(draw => draw()); }
};

// The lilac bar: sign in / create a profile, or "Playing as …"
function buildPlayerBar() {
  const bar = el("section", "player-bar");
  bar.setAttribute("aria-label", "Player profile");

  function draw() {
    bar.innerHTML = "";
    if (players.current) {
      const results = Object.values(players.save());
      const played = sumOf(results, "played"), wins = sumOf(results, "wins");
      const who = el("div", "player-who");
      const avatar = el("span", "player-avatar", players.current.charAt(0).toUpperCase());
      avatar.setAttribute("aria-hidden", "true");
      const text = el("div", "player-text");
      text.append(el("strong", "", "Playing as " + players.current),
                  el("span", "", played ? played + " game" + (played > 1 ? "s" : "") + " finished · " + wins + " won"
                                        : "No games finished yet. Progress saves automatically."));
      who.append(avatar, text);
      const out = el("button", "btn", "Sign out");
      // EVENT LISTENER: back to playing as a guest
      out.addEventListener("click", () => players.login(null));
      bar.append(who, out);
      return;
    }

    const text = el("div", "player-text");
    text.append(el("strong", "", "Save your progress"),
                el("span", "", "Create a player profile to keep your scores and pick up where you left off on your next visit."));
    const form = el("form", "player-form");
    form.noValidate = true;
    form.innerHTML = `
      <input name="player" placeholder="Player name" maxlength="20" autocomplete="username" aria-label="Player name">
      <input name="pin" type="password" placeholder="4-digit PIN" inputmode="numeric" maxlength="4" autocomplete="current-password" aria-label="4-digit PIN">
      <button class="btn" type="submit" value="signin">Sign in</button>
      <button class="btn btn-primary" type="submit" value="create">Create profile</button>`;
    const msg = el("p", "player-msg");
    msg.setAttribute("role", "status");

    // EVENT LISTENER: both buttons submit; event.submitter says which one
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const action = (event.submitter && event.submitter.value) || "signin";
      const name = form.elements.player.value.trim();
      const pin = form.elements.pin.value.trim();
      const id = name.toLowerCase();
      if (!name || !/^\d{4}$/.test(pin)) return (msg.textContent = "Enter a name and a 4-digit PIN.");
      const profiles = lsGet(PROFILES_KEY, {});
      if (action === "create") {
        if (profiles[id]) return (msg.textContent = "That name is taken. Sign in instead, or pick another.");
        profiles[id] = { name, pin: hashPin(pin), created: new Date().toISOString() };
        lsSet(PROFILES_KEY, profiles);
        lsSet(saveKeyFor(name), players.save(null));     // keep what was played as a guest
        players.login(name);
      } else {
        if (!profiles[id]) return (msg.textContent = "No profile with that name yet. Create one?");
        if (profiles[id].pin !== hashPin(pin)) return (msg.textContent = "Wrong PIN, try again.");
        players.login(profiles[id].name);
      }
    });
    bar.append(text, form, msg);
  }

  players.listeners.push(draw);
  draw();
  return bar;
}

// The ink leaderboard: best quiz scores + 5 points per win, top 5
function buildLeaderboard() {
  const board = el("section", "leaderboard");
  const head = el("div", "lb-head");
  head.append(heading("h2", "Leaderboard ", "top 5"), el("span", "", "Best quiz scores + 5 pts per win"));
  const list = el("ol", "lb-list");
  board.append(head, list);

  function draw() {
    list.innerHTML = "";
    const profiles = lsGet(PROFILES_KEY, {});
    const me = (players.current || "").toLowerCase();
    const rows = Object.keys(profiles).map(id => {
      const results = Object.values(players.save(profiles[id].name));
      const wins = sumOf(results, "wins");
      return { name: profiles[id].name, wins, played: sumOf(results, "played"),
               points: sumOf(results, "best") + wins * 5, mine: id === me };
    }).filter(r => r.points > 0).sort((a, b) => b.points - a.points).slice(0, 5);

    if (!rows.length) list.append(el("li", "lb-empty", "No scores yet. Create a profile and claim the top spot!"));
    rows.forEach((r, i) => {
      const li = el("li", "lb-row" + (r.mine ? " mine" : ""));
      const rank = el("span", "lb-rank" + (i === 0 ? " first" : ""), "①②③④⑤"[i]);
      rank.setAttribute("aria-label", "Rank " + (i + 1));
      const who = el("div", "lb-who");
      who.append(el("strong", "", r.name), el("span", "", (r.mine ? "You · " : "") + r.played + " played · " + r.wins + " won"));
      li.append(rank, who, el("span", "lb-points", r.points + " pts"));
      list.append(li);
    });
  }

  players.listeners.push(draw);
  draw();
  return board;
}

function buildGames(page) {

// Shuffles a copy of an array (Fisher–Yates shuffle)
function shuffle(array) {
  const copy = array.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

/* ---------- The game engine ----------
   createGame() works for ANY game object from section 5.

   STATE: each game keeps its own "state" object, so you can switch
   tabs and come back without losing your progress.
     state.round       → which round we're on (0, 1, 2…)
     state.question    → which question inside that round
     state.score       → total points so far
     state.roundScores → points per round (for the final screen)
     state.answered    → true once the current question is answered
                         (stops double-clicking for extra points)
     state.order       → the shuffled questions of each round

   SCREEN FLOW: start → round intro → questions → next round → … → results */
function createGame(panel, game) {
  // The sessions this theme draws on (each one only once)
  const sessions = [...new Set(game.rounds.map(r => r.session))];
  const maxScore = game.rounds.reduce((sum, r) => sum + r.questions.length, 0);
  let state;

  // Puts everything back to the beginning (used by Start and Play again)
  function resetState() {
    state = {
      round: 0,
      question: 0,
      score: 0,
      roundScores: game.rounds.map(() => 0),
      answered: false,
      order: game.rounds.map(r => shuffle(r.questions))   // new order on each play
    };
  }

  // Each screen starts with one fresh white card
  function newScreen(extraClass) {
    panel.innerHTML = "";
    const card = el("section", "card game" + (extraClass ? " " + extraClass : ""));
    panel.append(card);
    return card;
  }

  // Moves keyboard focus to the heading so screen readers announce the new screen
  function focusHeading(heading) {
    heading.tabIndex = -1;
    heading.focus({ preventScroll: true });
  }

  /* ----- Screen: Start ----- */
  function renderStart() {
    const card = newScreen();
    card.append(
      el("span", "eyebrow", "Theme · " + game.rounds.length + " rounds · " + maxScore + " questions"),
      el("h2", "", game.tabLabel),
      el("p", "muted", game.intro)
    );
    // Each round, with the session it comes from
    const list = el("ol", "round-list");
    game.rounds.forEach(r => {
      const li = el("li", "", r.title);
      li.append(el("span", "round-source", r.session.tabLabel));
      list.append(li);
    });
    card.append(list);

    const row = el("div", "btn-row");
    const startBtn = el("button", "btn btn-primary", "Start the game ▶");
    // EVENT LISTENER: Start resets the state and opens round 1
    startBtn.addEventListener("click", () => { resetState(); renderRoundIntro(); });
    row.append(startBtn);
    // One "revise" link per session used in this theme
    sessions.forEach(s => row.append(linkButton("Revise " + s.tabLabel, "#lectures/" + (SESSIONS.indexOf(s) + 1))));
    card.append(row);
  }

  /* ----- Screen: Round intro ----- */
  function renderRoundIntro() {
    const card = newScreen();
    const round = game.rounds[state.round];
    const isBonus = round.type === "text";
    const heading = el("h2", "", round.title);
    const count = round.questions.length;
    card.append(
      el("span", "eyebrow", (isBonus ? "Bonus" : "Round " + (state.round + 1)) + " · from " + round.session.tabLabel),
      heading,
      el("p", "muted", round.instructions),
      el("p", "", count + (count === 1 ? " question" : " questions") + " · Score so far: " + state.score)
    );
    const goBtn = el("button", "btn btn-primary", "Let's go");
    goBtn.addEventListener("click", renderQuestion);
    card.append(goBtn);
    focusHeading(heading);
  }

  /* ----- Screen: One question ----- */
  function renderQuestion() {
    const card = newScreen();
    state.answered = false;
    const round = game.rounds[state.round];
    const q = state.order[state.round][state.question];

    // Top bar: round + question number, and the score
    const top = el("div", "game-top");
    const scorePill = el("span", "score-pill", "Score: " + state.score);
    top.append(el("span", "eyebrow", round.title + " · " + (state.question + 1) + "/" + round.questions.length), scorePill);
    card.append(top);

    // Progress bar through the whole game
    const done = game.rounds.slice(0, state.round).reduce((s, r) => s + r.questions.length, 0) + state.question;
    const progress = el("div", "progress");
    const bar = el("span");
    bar.style.width = (done / maxScore) * 100 + "%";
    progress.append(bar);
    card.append(progress);

    const heading = el("h3", "", q.prompt);
    card.append(heading);
    if (round.type === "higherLower") {
      card.append(el("p", "muted", "Is the real figure higher or lower than…"), el("p", "stat-guess", q.guess));
    }

    // Feedback box: aria-live makes screen readers read it out
    const feedback = el("div", "feedback");
    feedback.setAttribute("aria-live", "polite");

    // "Next" button, hidden until the player answers
    const isLastQ = state.question === round.questions.length - 1;
    const isLastRound = state.round === game.rounds.length - 1;
    const nextBtn = el("button", "btn btn-primary",
      !isLastQ ? "Next question →" : isLastRound ? "See my results " : "Next round →");
    nextBtn.hidden = true;
    nextBtn.addEventListener("click", goNext);

    const ui = { q, feedback, nextBtn, scorePill };

    if (round.type === "text") {
      card.append(textAnswer(ui));
    } else {
      // Work out which answer buttons to show
      let options;
      if (round.type === "match") {
        const wrong = shuffle(round.choices.filter(c => c !== q.answer)).slice(0, 3);
        options = shuffle([q.answer, ...wrong]);
      } else if (round.type === "higherLower") {
        options = ["Higher", "Lower"];
      } else {
        options = round.buckets;      // "sort"
      }

      const box = el("div", options.length === 2 ? "options two-up" : "options");
      const buttons = options.map(value => {
        const btn = el("button", "option", value);
        btn.dataset.value = value;
        // EVENT LISTENER: each answer button checks the answer when clicked
        btn.addEventListener("click", () => checkAnswer(value === q.answer, ui, buttons, btn));
        box.append(btn);
        return btn;
      });
      card.append(box);
    }

    card.append(feedback, nextBtn);
    focusHeading(heading);
  }

  /* ----- Bonus: typed answer ----- */
  function textAnswer(ui) {
    const form = el("form", "text-answer");
    const input = el("input");
    input.type = "text";
    input.placeholder = "Type your answer…";
    input.autocomplete = "off";
    input.setAttribute("aria-label", "Your answer");
    const submit = el("button", "btn btn-primary", "Check");
    submit.type = "submit";
    const hintBtn = el("button", "btn", "Hint");
    hintBtn.type = "button";
    form.append(input, submit, hintBtn);

    hintBtn.addEventListener("click", () => {
      ui.feedback.className = "feedback";
      ui.feedback.textContent = ui.q.hint;
    });

    // EVENT LISTENER: "submit" fires on button click AND on pressing Enter
    form.addEventListener("submit", (event) => {
      event.preventDefault();                     // stop the page from reloading
      if (state.answered || !input.value.trim()) return;
      const guess = input.value.trim().toLowerCase();
      const correct = ui.q.accept.some(word => guess.includes(word));
      input.disabled = submit.disabled = hintBtn.disabled = true;
      checkAnswer(correct, ui, [], null);
    });
    return form;
  }

  /* ----- Checking an answer ----- */
  function checkAnswer(isCorrect, ui, buttons, clicked) {
    if (state.answered) return;     // ignore extra clicks
    state.answered = true;

    if (isCorrect) {
      state.score++;
      state.roundScores[state.round]++;
      ui.scorePill.textContent = "Score: " + state.score;
      ui.scorePill.classList.add("bump");
    }

    // Green for the right answer, red for a wrong pick, faded for the rest
    buttons.forEach(btn => {
      btn.disabled = true;
      if (btn.dataset.value === ui.q.answer) btn.classList.add("is-correct");
      else if (btn === clicked) btn.classList.add("is-wrong");
      else btn.classList.add("is-dimmed");
    });

    ui.feedback.className = "feedback " + (isCorrect ? "good" : "bad");
    ui.feedback.innerHTML = "";
    ui.feedback.append(
      el("strong", "", isCorrect ? "Correct!" : "Not quite. Answer: " + ui.q.answer),
      el("p", "", ui.q.explain)
    );
    ui.nextBtn.hidden = false;
    ui.nextBtn.focus();
  }

  /* ----- Moving forward ----- */
  function goNext() {
    const round = game.rounds[state.round];
    if (state.question < round.questions.length - 1) {
      state.question++;                       // next question, same round
      renderQuestion();
    } else if (state.round < game.rounds.length - 1) {
      state.round++;                          // next round
      state.question = 0;
      renderRoundIntro();
    } else {
      renderResults();                        // game over
    }
  }

  /* ----- Screen: Results ----- */
  function renderResults() {
    players.record(game, state.score === maxScore, state.score);
    const card = newScreen("center");
    const percent = Math.round((state.score / maxScore) * 100);
    const badge = BADGES.find(b => percent >= b.min);

    const heading = el("h2", "", "Game complete!");
    const badgeCircle = el("div", "badge", badge.icon);
    badgeCircle.setAttribute("aria-hidden", "true");
    card.append(
      el("span", "eyebrow", game.tabLabel + " · Results"),
      heading,
      badgeCircle,
      el("p", "badge-name", badge.name),
      el("p", "big-score", state.score + " / " + maxScore),
      el("p", "muted", percent + "% correct")
    );

    const list = el("ul", "round-breakdown");
    game.rounds.forEach((r, i) =>
      list.append(el("li", "", r.title + ": " + state.roundScores[i] + "/" + r.questions.length)));
    card.append(list);

    const takeaway = el("div", "takeaway");
    takeaway.append(el("strong", "", "Key takeaway"), el("p", "", game.takeaway));
    card.append(takeaway);

    const row = el("div", "btn-row");
    row.style.justifyContent = "center";
    const again = el("button", "btn btn-primary", "Play again ↻");
    // EVENT LISTENER: Play again resets the state and goes back to round 1
    again.addEventListener("click", () => { resetState(); renderRoundIntro(); });
    row.append(again);
    const nextGame = GAMES.indexOf(game) + 1;
    if (nextGame < GAMES.length) row.append(linkButton("Next game →", "#games/" + (nextGame + 1)));
    card.append(row);
    focusHeading(heading);
  }

  resetState();
  renderStart();
}

/* ---------- Helpers shared by the Word Game and Hangman ---------- */

// Picks a random word, avoiding the one just played
function pickWord(words, previous) {
  const choices = words.filter(w => w !== previous);
  return choices[Math.floor(Math.random() * choices.length)];
}

// True when this game's panel is the one on screen
// (so typing on the keyboard only plays the game you're looking at)
function isOnScreen(panel) {
  return panel.offsetParent !== null;
}

// A small "Played · Won · Streak" line
function statsLine(stats) {
  return "Played " + stats.played + " · Won " + stats.won + " · Streak " + stats.streak;
}

/* ---------- THE WORD GAME (Wordle style) ----------
   STATE:
     answer   → the word to find ({ word, clue })
     guesses  → the words already tried
     current  → the letters typed in the current row
     over     → true once won or lost
   COLOURS (after pressing Enter), per letter:
     "correct" → right letter, right place
     "present" → in the word, but somewhere else
     "absent"  → not in the word                                   */
function createWordGame(panel, game) {
  const ROWS = 6, COLS = 5;
  // Words players may guess: my Pinkle dictionary + the course words.
  // If the dictionary file didn't load, every 5-letter guess is accepted.
  const valid = new Set((window.PINKLE_VALID || "").toUpperCase().split(" ").filter(Boolean));
  game.words.forEach(w => valid.add(w.word));
  const checkWords = valid.size > game.words.length;

  // Stats are saved in the browser (localStorage) so they survive a refresh.
  // try/catch: some browsers block storage; the game still works without it.
  const STATS_KEY = "pinkle-course-stats";
  function loadStats() {
    try { return JSON.parse(localStorage.getItem(STATS_KEY)) || null; } catch { return null; }
  }
  function saveStats() {
    try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch {}
  }
  const stats = loadStats() || { played: 0, won: 0, streak: 0, best: 0, dist: [0, 0, 0, 0, 0, 0] };

  let answer, guesses, current, over;
  let tiles, keys, message, statsEl, actions;

  const card = el("section", "card game wordgame");
  panel.append(card);

  function newGame() {
    answer = pickWord(game.words, answer);
    guesses = [];
    current = "";
    over = false;
    draw();
  }

  /* ----- Build the screen ----- */
  function draw() {
    card.innerHTML = "";
    const title = el("h2", "pinkle-title", "Pink");
    title.append(el("span", "", "le"));                 // "Pinkle", like my original logo
    card.append(
      el("span", "eyebrow", "Word game · 5 letters · 6 tries"),
      title,
      el("p", "muted", game.intro)
    );

    // Colour legend
    const legend = el("div", "wg-legend");
    [["correct", "Right place"], ["present", "Wrong place"], ["absent", "Not in the word"]].forEach(([state, text]) => {
      const item = el("span");
      item.append(el("i", "wg-dot " + state), document.createTextNode(text));
      legend.append(item);
    });
    card.append(legend);

    // The 6 × 5 grid of tiles
    const grid = el("div", "wg-grid");
    grid.setAttribute("role", "grid");
    grid.setAttribute("aria-label", "Your guesses");
    tiles = [];
    for (let r = 0; r < ROWS; r++) {
      const row = el("div", "wg-row");
      row.setAttribute("role", "row");
      const rowTiles = [];
      for (let c = 0; c < COLS; c++) {
        const tile = el("div", "wg-tile");
        tile.setAttribute("role", "gridcell");
        row.append(tile);
        rowTiles.push(tile);
      }
      grid.append(row);
      tiles.push(rowTiles);
    }
    card.append(grid);

    // Message line (screen readers announce it)
    message = el("p", "wg-message");
    message.setAttribute("aria-live", "polite");
    card.append(message);

    // On-screen keyboard
    const keyboard = el("div", "wg-keyboard");
    keys = {};
    ["QWERTYUIOP", "ASDFGHJKL", "+ZXCVBNM-"].forEach(letters => {
      const row = el("div", "wg-keyrow");
      [...letters].forEach(ch => {
        const label = ch === "+" ? "Enter" : ch === "-" ? "Delete" : ch;
        const key = el("button", "wg-key" + (label.length > 1 ? " wide" : ""), label === "Delete" ? "⌫" : label);
        if (label === "Delete") key.setAttribute("aria-label", "Delete");
        // EVENT LISTENER: each on-screen key types like the real keyboard
        key.addEventListener("click", () => press(label));
        row.append(key);
        if (label.length === 1) keys[label] = key;
      });
      keyboard.append(row);
    });
    card.append(keyboard);

    // Bottom row: hint, new word, stats
    actions = el("div", "btn-row");
    const hintBtn = el("button", "btn", "Hint");
    hintBtn.addEventListener("click", () => { if (!over) say("Hint: " + answer.clue.replace(new RegExp(answer.word, "gi"), "•••••")); });
    const newBtn = el("button", "btn", "New word");
    newBtn.addEventListener("click", newGame);
    actions.append(hintBtn, newBtn);
    card.append(actions);
    statsEl = el("div", "pk-stats");
    card.append(statsEl);
    showStats(false);
  }

  function say(text) { message.textContent = text; }

  // Played · Win % · Streak · Best, and (after a game) the guess distribution
  function showStats(withDistribution, winRow) {
    statsEl.innerHTML = "";
    const numbers = el("div", "pk-numbers");
    [[stats.played, "Played"], [stats.played ? Math.round(100 * stats.won / stats.played) : 0, "Win %"],
     [stats.streak, "Streak"], [stats.best, "Best"]].forEach(([n, label]) => {
      const box = el("div");
      box.append(el("b", "", String(n)), el("span", "", label));
      numbers.append(box);
    });
    statsEl.append(numbers);
    if (!withDistribution) return;
    statsEl.append(el("p", "pk-dist-title", "Guess distribution"));
    const max = Math.max(1, ...stats.dist);
    stats.dist.forEach((n, i) => {
      const row = el("div", "pk-bar-row");
      const bar = el("div", "pk-bar" + (winRow === i + 1 ? " hit" : ""), String(n));
      bar.style.width = Math.max(8, 100 * n / max) + "%";
      row.append(el("span", "", String(i + 1)), bar);
      statsEl.append(row);
    });
  }

  /* ----- Typing ----- */
  function press(key) {
    if (over) return;
    const row = guesses.length;
    if (key === "Enter") return submit();
    if (key === "Delete") {
      current = current.slice(0, -1);
    } else if (/^[A-Z]$/.test(key) && current.length < COLS) {
      current += key;
    }
    // Show the letters typed so far in the current row
    tiles[row].forEach((tile, i) => {
      tile.textContent = current[i] || "";
      tile.classList.toggle("filled", !!current[i]);
    });
  }

  /* ----- Checking a guess ----- */
  function score(guess, word) {
    const result = Array(COLS).fill("absent");
    const left = {};                        // letters of the answer not matched yet
    // 1st pass: right letter in the right place
    for (let i = 0; i < COLS; i++) {
      if (guess[i] === word[i]) result[i] = "correct";
      else left[word[i]] = (left[word[i]] || 0) + 1;
    }
    // 2nd pass: right letter, wrong place (only as many times as it's left)
    for (let i = 0; i < COLS; i++) {
      if (result[i] !== "correct" && left[guess[i]]) {
        result[i] = "present";
        left[guess[i]]--;
      }
    }
    return result;
  }

  function submit() {
    const row = guesses.length;
    const shake = () => {
      const r = tiles[row][0].parentElement;
      r.classList.remove("shake");
      void r.offsetWidth;                                     // restart the animation
      r.classList.add("shake");
    };
    if (current.length < COLS) { say("Not enough letters"); shake(); return; }
    if (checkWords && !valid.has(current)) { say("Not in word list"); shake(); return; }
    const result = score(current, answer.word);
    tiles[row].forEach((tile, i) => {
      tile.style.animationDelay = i * 0.12 + "s";             // flip one after another
      tile.classList.add("flip", result[i]);
      tile.setAttribute("aria-label", current[i] + ", " + result[i]);
      // Keyboard colours: never downgrade (correct > present > absent)
      const key = keys[current[i]];
      const rank = { absent: 1, present: 2, correct: 3 };
      const now = ["correct", "present", "absent"].find(c => key.classList.contains(c));
      if (!now || rank[result[i]] > rank[now]) {
        key.classList.remove("correct", "present", "absent");
        key.classList.add(result[i]);
      }
    });
    guesses.push(current);
    const won = current === answer.word;
    current = "";
    say("");
    if (won || guesses.length === ROWS) finish(won);
  }

  function finish(won) {
    over = true;
    players.record(game, won);
    stats.played++;
    if (won) {
      stats.won++;
      stats.streak++;
      stats.best = Math.max(stats.best, stats.streak);
      stats.dist[guesses.length - 1]++;
    } else {
      stats.streak = 0;
    }
    saveStats();
    showStats(true, won ? guesses.length : null);
    // Same praise as my original Pinkle, by number of tries
    const praise = ["Genius!", "Magnificent!", "Impressive!", "Splendid!", "Great!", "Phew!"][guesses.length - 1];
    if (won) tiles[guesses.length - 1].forEach((t, i) => setTimeout(() => t.classList.add("win"), 700 + i * 100));
    const end = el("div", "feedback " + (won ? "good" : "bad"));
    end.append(
      el("strong", "", won ? praise + " You found " + answer.word + " in " + guesses.length + (guesses.length === 1 ? " try" : " tries") + "."
                           : "So close! The word was " + answer.word + "."),
      el("p", "", answer.clue)
    );
    message.after(end);
    const again = el("button", "btn btn-primary", "Play again ↻");
    again.addEventListener("click", newGame);
    actions.prepend(again);
    again.focus({ preventScroll: true });
  }

  // EVENT LISTENER: the real keyboard, only while this game is on screen
  document.addEventListener("keydown", (event) => {
    if (!isOnScreen(panel) || event.metaKey || event.ctrlKey || event.altKey) return;
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    const k = event.key;
    if (k === "Enter") {
      if (document.activeElement.tagName === "BUTTON") return;   // let Enter click a focused button
      event.preventDefault(); press("Enter");
    }
    else if (k === "Backspace") { event.preventDefault(); press("Delete"); }
    else if (/^[a-z]$/i.test(k)) press(k.toUpperCase());
  });

  newGame();
}

/* ---------- HANGMAN ----------
   STATE:
     answer  → { word, hint, explain }
     guessed → a Set of letters already tried
     wrong   → how many wrong letters (6 = lost)
   The drawing has 6 parts; each wrong letter shows one more.        */
function createHangman(panel, game) {
  const MAX = 6;
  const stats = { played: 0, won: 0, streak: 0 };
  let answer, guessed, wrong, over;
  let wordEl, parts, letterBtns, livesEl, message, statsEl, actions;

  const card = el("section", "card game hangman");
  panel.append(card);

  function newGame() {
    answer = pickWord(game.words, answer);
    guessed = new Set();
    wrong = 0;
    over = false;
    draw();
  }

  function draw() {
    card.innerHTML = "";
    card.append(
      el("span", "eyebrow", "Hangman · " + MAX + " wrong guesses allowed"),
      el("h2", "", game.tabLabel),
      el("p", "muted", game.intro)
    );

    const layout = el("div", "hm-layout");

    // The drawing: an SVG whose parts appear one by one
    const art = el("div", "hm-art");
    art.innerHTML = `
      <svg viewBox="0 0 120 140" aria-hidden="true">
        <path class="hm-base" d="M10 132h70M30 132V10h52v16"/>
        <circle class="hm-part" cx="82" cy="38" r="12"/>
        <path class="hm-part" d="M82 50v36"/>
        <path class="hm-part" d="M82 60l-16 14"/>
        <path class="hm-part" d="M82 60l16 14"/>
        <path class="hm-part" d="M82 86l-14 22"/>
        <path class="hm-part" d="M82 86l14 22"/>
      </svg>`;
    parts = [...art.querySelectorAll(".hm-part")];
    layout.append(art);

    const side = el("div", "hm-side");
    side.append(el("span", "hm-hint", answer.hint));
    wordEl = el("p", "hm-word");
    wordEl.setAttribute("aria-live", "polite");
    side.append(wordEl);
    livesEl = el("p", "hm-lives");
    side.append(livesEl);
    layout.append(side);
    card.append(layout);

    message = el("div");
    card.append(message);

    // A–Z buttons
    const letters = el("div", "hm-letters");
    letterBtns = {};
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(ch => {
      const b = el("button", "wg-key", ch);
      // EVENT LISTENER: each letter button makes a guess
      b.addEventListener("click", () => guess(ch));
      letters.append(b);
      letterBtns[ch] = b;
    });
    card.append(letters);

    actions = el("div", "btn-row");
    const newBtn = el("button", "btn", "New word");
    newBtn.addEventListener("click", newGame);
    actions.append(newBtn);
    card.append(actions);
    statsEl = el("p", "wg-stats", statsLine(stats));
    card.append(statsEl);

    update();
  }

  // Shows the word with "_" for letters not found yet (spaces stay as gaps)
  function update() {
    wordEl.innerHTML = "";
    [...answer.word].forEach(ch => {
      if (ch === " ") { wordEl.append(el("span", "hm-gap")); return; }
      const found = guessed.has(ch) || over;
      const slot = el("span", "hm-slot" + (found ? " found" : "") + (over && !guessed.has(ch) ? " missed" : ""), found ? ch : "");
      wordEl.append(slot);
    });
    wordEl.setAttribute("aria-label", [...answer.word].map(ch => ch === " " ? " " : (guessed.has(ch) || over ? ch : "blank")).join(" "));
    parts.forEach((p, i) => p.classList.toggle("shown", i < wrong));
    livesEl.textContent = (MAX - wrong) + " wrong guess" + (MAX - wrong === 1 ? "" : "es") + " left";
  }

  function guess(ch) {
    if (over || guessed.has(ch)) return;
    guessed.add(ch);
    const hit = answer.word.includes(ch);
    letterBtns[ch].disabled = true;
    letterBtns[ch].classList.add(hit ? "correct" : "absent");
    if (!hit) wrong++;
    const won = [...answer.word].every(c => c === " " || guessed.has(c));
    if (won || wrong >= MAX) { over = true; finish(won); }
    update();
  }

  function finish(won) {
    players.record(game, won);
    stats.played++;
    if (won) { stats.won++; stats.streak++; } else { stats.streak = 0; }
    statsEl.textContent = statsLine(stats);
    message.className = "feedback " + (won ? "good" : "bad");
    message.append(
      el("strong", "", won ? "Well done! " + answer.word + " it is." : "So close! The answer was " + answer.word + "."),
      el("p", "", answer.explain)
    );
    Object.values(letterBtns).forEach(b => b.disabled = true);
    const again = el("button", "btn btn-primary", "Play again ↻");
    again.addEventListener("click", newGame);
    actions.prepend(again);
    again.focus({ preventScroll: true });
  }

  // EVENT LISTENER: type letters on the real keyboard (only while on screen)
  document.addEventListener("keydown", (event) => {
    if (!isOnScreen(panel) || event.metaKey || event.ctrlKey || event.altKey) return;
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    if (/^[a-z]$/i.test(event.key)) guess(event.key.toUpperCase());
  });

  newGame();
}

/* ---------- AKINATOR (reverse) ----------
   The site picks a secret concept; the player asks yes/no questions.
   STATE:
     secret      → the concept to find
     asked       → questions already asked (in order), with their answer
     crossed     → cards the player crossed out (a Set of indexes)
     guessesLeft → 3 at the start
     guessing    → true while "Make a guess" mode is on (a card click = a guess)
   Answer rule: YES if the secret concept's tags include the question's tag. */
function createAkinator(panel, game) {
  const GUESSES = 3;
  const STATS_KEY = "akinator-stats";
  const loadStats = () => { try { return JSON.parse(localStorage.getItem(STATS_KEY)); } catch { return null; } };
  const saveStats = () => { try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch {} };
  const stats = loadStats() || { played: 0, won: 0, best: null };   // best = fewest questions in a win

  let secret, asked, crossed, guessesLeft, guessing, over;
  let bubble, logEl, qButtons, cards, guessBtn, infoEl, statsEl, endEl, boardLabel;

  const card = el("section", "card game akinator");
  panel.append(card);

  function newGame() {
    secret = pickWord(game.concepts, secret);
    asked = [];
    crossed = new Set();
    guessesLeft = GUESSES;
    guessing = false;
    over = false;
    draw();
  }

  function draw() {
    card.innerHTML = "";
    card.append(
      el("span", "eyebrow", "Reverse Akinator · yes/no questions · " + GUESSES + " guesses"),
      el("h2", "", game.tabLabel),
      el("p", "muted", game.intro)
    );

    // The genie and its speech bubble
    const genie = el("div", "ak-genie");
    const lamp = el("div", "ak-lamp");
    lamp.setAttribute("aria-hidden", "true");
    lamp.innerHTML = '<svg viewBox="0 0 64 64"><circle cx="32" cy="28" r="18"/><path d="M20 50h24M24 56h16M26 46l-2 4M38 46l2 4"/><path d="M32 18l2.5 6.5L41 27l-6.5 2.5L32 36l-2.5-6.5L23 27l6.5-2.5z"/></svg>';
    bubble = el("p", "ak-bubble", "I'm thinking of a concept from the course… Ask me a question!");
    bubble.setAttribute("aria-live", "polite");
    genie.append(lamp, bubble);
    card.append(genie);

    const layout = el("div", "ak-layout");

    // Left: questions + log
    const left = el("div", "ak-left");
    left.append(el("p", "ak-label", "Ask a question"));
    const qList = el("div", "ak-questions");
    qButtons = game.questions.map((q, i) => {
      const b = el("button", "ak-q", q.text);
      // EVENT LISTENER: asking a question
      b.addEventListener("click", () => ask(i));
      qList.append(b);
      return b;
    });
    left.append(qList);
    left.append(el("p", "ak-label", "Your notes"));
    logEl = el("ol", "ak-log");
    left.append(logEl);
    layout.append(left);

    // Right: the board of concepts
    const right = el("div", "ak-right");
    const head = el("div", "ak-board-head");
    boardLabel = el("p", "ak-label", "Click a card to cross it out");
    head.append(boardLabel);
    infoEl = el("p", "ak-info");
    head.append(infoEl);
    right.append(head);
    const board = el("div", "ak-board");
    cards = game.concepts.map((c, i) => {
      const b = el("button", "ak-card", c.name);
      b.setAttribute("aria-pressed", "false");
      // EVENT LISTENER: cross out / un-cross a card, or guess it in guess mode
      b.addEventListener("click", () => guessing ? guess(i) : toggle(i));
      board.append(b);
      return b;
    });
    right.append(board);
    layout.append(right);
    card.append(layout);

    endEl = el("div");
    card.append(endEl);

    const row = el("div", "btn-row");
    guessBtn = el("button", "btn btn-primary", "I know! Make a guess");
    guessBtn.addEventListener("click", () => setGuessing(!guessing));
    const newBtn = el("button", "btn", "New game");
    newBtn.addEventListener("click", newGame);
    row.append(guessBtn, newBtn);
    card.append(row);

    statsEl = el("p", "wg-stats");
    card.append(statsEl);
    update();
  }

  function update() {
    infoEl.textContent = asked.length + (asked.length === 1 ? " question" : " questions") + " · " +
                         guessesLeft + (guessesLeft === 1 ? " guess" : " guesses") + " left · " +
                         (game.concepts.length - crossed.size) + (game.concepts.length - crossed.size === 1 ? " card" : " cards") + " left";
    statsEl.textContent = "Played " + stats.played + " · Won " + stats.won +
                          " · Best: " + (stats.best === null ? "–" : stats.best + " questions");
  }

  function ask(i) {
    if (over) return;
    const q = game.questions[i];
    const yes = secret.tags.includes(q.tag);
    asked.push({ q, yes });
    qButtons[i].disabled = true;
    qButtons[i].classList.add(yes ? "yes" : "no");
    qButtons[i].append(el("span", "ak-answer", yes ? "Yes" : "No"));
    const li = el("li", yes ? "yes" : "no");
    li.append(el("span", "", q.text), el("b", "", yes ? "Yes" : "No"));
    logEl.append(li);
    bubble.textContent = yes ? "Yes! ✦" : "No.";
    update();
  }

  function toggle(i) {
    if (over) return;
    if (crossed.has(i)) crossed.delete(i); else crossed.add(i);
    cards[i].classList.toggle("crossed", crossed.has(i));
    cards[i].setAttribute("aria-pressed", String(crossed.has(i)));
    update();
  }

  function setGuessing(on) {
    guessing = on;
    card.classList.toggle("guess-mode", on);
    guessBtn.textContent = on ? "Cancel guess" : "I know! Make a guess";
    boardLabel.textContent = on ? "Guess mode: click your answer" : "Click a card to cross it out";
    bubble.textContent = on ? "Go on, click the card you think I'm thinking of…" : "Ask me another question!";
  }

  function guess(i) {
    if (over) return;
    const right = game.concepts[i] === secret;
    if (right) return finish(true);
    guessesLeft--;
    cards[i].classList.add("crossed", "wrong-guess");
    crossed.add(i);
    if (guessesLeft === 0) return finish(false);
    setGuessing(false);                                   // first leave guess mode…
    bubble.textContent = "Not that one! " + guessesLeft + (guessesLeft === 1 ? " guess" : " guesses") + " left.";   // …then say why
    update();
  }

  function finish(won) {
    over = true;
    players.record(game, won);
    setGuessing(false);
    stats.played++;
    if (won) {
      stats.won++;
      if (stats.best === null || asked.length < stats.best) stats.best = asked.length;
    }
    saveStats();
    cards[game.concepts.indexOf(secret)].classList.add("secret");
    qButtons.forEach(b => b.disabled = true);
    bubble.textContent = won ? "You read my mind! ✦" : "I win this time!";
    endEl.className = "feedback " + (won ? "good" : "bad");
    endEl.append(
      el("strong", "", won ? "Found in " + asked.length + (asked.length === 1 ? " question" : " questions") + ": " + secret.name + "!"
                           : "I was thinking of: " + secret.name),
      el("p", "", secret.explain)
    );
    guessBtn.textContent = "Play again ↻";
    guessBtn.onclick = null;
    guessBtn.replaceWith(guessBtn.cloneNode(true));     // drop the old click listener
    const again = card.querySelector(".btn-row .btn-primary");
    again.addEventListener("click", newGame);
    again.focus({ preventScroll: true });
    update();
  }

  newGame();
}

               el("p", "pg-lead", "I'm happy to talk about digital marketing, internships or this course."));

  // EVENT LISTENER: copies the email address to the clipboard
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(PROFILE.email);
      showToast("Email copied ♡");
    } catch {
      showToast("Couldn't copy, please select the address instead");
    }
  });
  const open = linkButton("Open ↗", PROFILE.linkedin, false, true);
  open.setAttribute("aria-label", "Open my LinkedIn (new tab)");
  list.append(contactItem("✉", "Email", PROFILE.email, copyBtn, 0),
              contactItem("in", "LinkedIn", "linkedin.com/in/zoecoulloux", open, 1),
              contactItem("✈", "Based in", PROFILE.location, null, 2));

  // Right: message form. It opens the visitor's own email app
  // with the message ready to send (no server needed).
  const form = el("form", "card contact-form");
  form.noValidate = true;     // we check the fields ourselves below
  form.innerHTML = `
    <h2>Send me a <em>message</em></h2>
    <label for="c-name">Your name</label>
    <input id="c-name" name="name" autocomplete="name" required>
    <label for="c-subject">Subject</label>
    <input id="c-subject" name="subject" required>
    <label for="c-message">Message</label>
    <textarea id="c-message" name="message" rows="5" required></textarea>
    <div class="btn-row"><button class="btn btn-primary" type="submit">Open in my email app ✉</button></div>
    <p class="form-msg" role="status" aria-live="polite"></p>`;

  // EVENT LISTENER: "submit" fires on button click AND on pressing Enter
  form.addEventListener("submit", (event) => {
    event.preventDefault();                     // stop the page from reloading
    const msg = form.querySelector(".form-msg");
    const name = form.querySelector("#c-name").value.trim();
    const subject = form.querySelector("#c-subject").value.trim();
    const message = form.querySelector("#c-message").value.trim();
    if (!name || !subject || !message) {
      msg.textContent = "Please fill in all three fields.";
      return;
    }
    // mailto: link with the subject and message filled in
    const body = message + "\n\nFrom " + name;
    window.location.href = "mailto:" + PROFILE.email +
      "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
    msg.textContent = "Your email app should open now. Thank you! ♡";
  });

  split.append(list, form);
  page.append(split);
}

// One tinted contact row: round icon, label + value, optional button

/* =================================================================
   10. NAVIGATION (hash routing)
   -----------------------------------------------------------------
   The menu links change the part of the URL after "#", e.g.
   index.html#about. The browser then fires a "hashchange" event,
   and showPage() displays the matching page. Bonus: the browser's
   Back button works, and you can share a link to one page.

   "#lectures/2" opens the Sessions page on SESSIONS[1],
   "#games/3" opens the Games page on its 3rd game.
   ================================================================= */
const menuLinks = document.querySelectorAll(".menu a");
const menu = document.getElementById("menu");
const menuToggle = document.getElementById("menu-toggle");

function showPage() {
  // "#lectures/2" → name = "lectures", sub = "2"
  const [name, sub] = location.hash.slice(1).split("/");
  // The old Schedule page is now part of "Sessions & schedule"
  if (name === "schedule") { location.replace("#lectures"); return; }
  const pageName = PAGES[name] ? name : "home";

  // The Welcome page is a little wider than the other pages
  document.body.classList.toggle("is-home", pageName === "home");

  // Show one page, hide the others
  Object.keys(PAGES).forEach(key => {
    document.getElementById("page-" + key).hidden = key !== pageName;
  });

  // Highlight the current menu link. Merged pages light up their parent:
  // Sessions & schedule → The course, How I built it → About me
  const navName = { lectures: "course", built: "about" }[pageName] || pageName;
  menuLinks.forEach(link => {
    if (link.getAttribute("href") === "#" + navName) link.setAttribute("aria-current", "page");
    else link.removeAttribute("aria-current");
  });

  // Update the browser tab title
  document.title = PAGES[pageName].title + " – " + PROFILE.name;

  // Pages with sub-tabs: "#games/2" opens tab number 2
  const tabSet = TABSETS[pageName];
  if (tabSet) {
    const number = parseInt(sub, 10);
    const index = number ? Math.min(Math.max(number - 1, 0), tabSet.count - 1)
                         : (tabSet.defaultIndex || 0);
    tabSet.select(index);
  }

  // Close the phone menu and go back to the top
  menu.classList.remove("is-open");
  menuToggle.setAttribute("aria-expanded", "false");
  window.scrollTo({ top: 0, behavior: "instant" });
}

// EVENT LISTENER: runs every time the URL hash changes
window.addEventListener("hashchange", showPage);

// EVENT LISTENER: the button opens/closes the menu on phones
menuToggle.addEventListener("click", () => {
  const open = menu.classList.toggle("is-open");
  menuToggle.setAttribute("aria-expanded", String(open));
});

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Music: a hidden YouTube player ----------
   The YouTube IFrame API is loaded only when music is first asked for.
   Songs play in a shuffled order; when one ends (or fails) the next starts. */
const music = {
  playing: false,
  queue: [],
  current: null,
  player: null,
  ready: null,
  button: null,

  nextId() {
    if (!this.queue.length) {
      this.queue = shuffle(MUSIC_IDS);
      if (this.queue[0] === this.current && this.queue.length > 1) this.queue.push(this.queue.shift());
    }
    this.current = this.queue.shift();
    return this.current;
  },

  load() {
    if (this.ready) return this.ready;
    this.ready = new Promise(resolve => {
      const make = () => {
        const host = el("div");
        host.style.cssText = "position:fixed;width:1px;height:1px;left:-10px;bottom:0;opacity:0;pointer-events:none;";
        const inner = el("div");
        host.append(inner);
        document.body.append(host);
        this.player = new YT.Player(inner, {
          videoId: this.nextId(), width: 1, height: 1,
          playerVars: { autoplay: 0, controls: 0, playsinline: 1 },
          events: {
            onReady: () => resolve(this.player),
            onStateChange: ev => { if (ev.data === 0) this.player.loadVideoById(this.nextId()); },   // 0 = ended
            onError: () => { if (this.playing) this.player.loadVideoById(this.nextId()); }
          }
        });
      };
      if (window.YT && window.YT.Player) return make();
      const previous = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (previous) previous(); make(); };
      const script = el("script");
      script.src = "https://www.youtube.com/iframe_api";
      document.head.append(script);
    });
    return this.ready;
  },

  play() {
    this.playing = true;
    this.update();
    this.load().then(p => { p.setVolume(45); if (this.playing) p.playVideo(); });
  },

  pause() {
    this.playing = false;
    this.update();
    if (this.player && this.player.pauseVideo) this.player.pauseVideo();
  },

  update() {
    this.button.classList.toggle("is-playing", this.playing);
    this.button.querySelector(".label").textContent = this.playing ? "Pause music" : "Play some music";
    this.button.setAttribute("aria-pressed", String(this.playing));
  }
};
