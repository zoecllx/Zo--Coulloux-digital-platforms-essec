<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Platforms Test Drive – Zoé Coulloux</title>

  <!-- Fonts: an elegant serif for headings, a refined sans-serif for text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- =========================================================
       CSS
       All colours and fonts live in :root as CSS variables, so
       the whole look can be changed in one place.
       ========================================================= -->
  <style>
    :root {
      /* --- Luxury pink palette --- */
      --ivory:     #fdf1f5;   /* page background: soft blush pink */
      --paper:     #fffafc;   /* cards: pink-tinted white */
      --blush:     #fbe1ea;   /* soft pink tint */
      --blush-2:   #f3c6d6;   /* borders, tracks */
      --rose:      #e58fae;   /* soft pink accent */
      --rose-deep: #c2336a;   /* main accent: raspberry pink */
      --gold:      #b8925a;   /* champagne gold: hairlines, labels */
      --gold-soft: #e3c99a;
      --ink:       #4a0f2c;   /* deep berry: text, banner, buttons */
      --berry:     #7d1c4a;   /* lighter berry for gradients */
      --mauve:     #8a5670;   /* secondary text */
      --white:     #ffffff;

      /* --- Feedback colours (muted, still clear) --- */
      --correct:    #3f7a5f;
      --correct-bg: #eaf3ee;
      --wrong:      #a83e52;
      --wrong-bg:   #f9e9ec;

      /* --- Type --- */
      --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --sans:  "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;

      /* --- Shape & motion --- */
      --radius: 4px;            /* luxury = crisp, barely rounded corners */
      --hairline: 1px solid var(--blush-2);
      --shadow: 0 1px 2px rgba(122, 28, 74, 0.05), 0 14px 36px rgba(194, 51, 106, 0.08);
      --focus: 0 0 0 2px var(--paper), 0 0 0 4px var(--gold);
      --speed: 0.35s;
      --ease: cubic-bezier(.22, .61, .36, 1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    /* Anything with the "hidden" attribute stays hidden, even if another
       rule gives it display: grid or flex (e.g. the schedule filter) */
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: var(--sans);
      font-weight: 300;
      font-size: 1.02rem;
      background: var(--ivory);
      color: var(--ink);
      line-height: 1.75;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--rose-deep); text-underline-offset: 3px; }
    strong { font-weight: 500; }

    /* Visible keyboard focus on every interactive element */
    :focus-visible { outline: none; box-shadow: var(--focus); }

    /* "Skip to content" link: hidden until a keyboard user presses Tab */
    .skip-link {
      position: absolute;
      left: 1rem;
      top: -3rem;
      background: var(--ink);
      color: var(--ivory);
      padding: 0.5rem 1rem;
      z-index: 20;
      transition: top var(--speed);
    }
    .skip-link:focus { top: 1rem; }

    /* Headings use the serif */
    h1, h2, h3, h4 { font-family: var(--serif); font-weight: 500; letter-spacing: 0.01em; color: var(--ink); }
    h2 { font-size: clamp(1.9rem, 4.5vw, 2.7rem); margin: 0.5rem 0 0.6rem; line-height: 1.1; }
    h3 { font-size: clamp(1.45rem, 3vw, 1.75rem); margin: 0 0 0.35rem; line-height: 1.2; }
    h4 { font-size: 1.3rem; }

    /* Small-caps label used above headings */
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--gold);
      font-family: var(--sans);
      font-weight: 500;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
    }
    .eyebrow::before { content: ""; width: 28px; height: 1px; background: currentColor; }

    .muted { color: var(--mauve); }
    .card-intro { color: var(--mauve); margin: 0 0 1.5rem; }
    .meta { display: flex; flex-wrap: wrap; gap: 0.4rem 1.75rem; color: var(--mauve); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; }

    /* =========================================================
       MAIN MENU (sticky bar at the top)
       ========================================================= */
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(253, 241, 245, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: var(--hairline);
    }
    .nav-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      font-family: var(--serif);
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
      letter-spacing: 0.04em;
    }
    .brand span { color: var(--gold); font-style: italic; }

    .menu { display: flex; gap: 0.25rem; list-style: none; margin: 0; padding: 0; }
    .menu a {
      display: block;
      position: relative;
      padding: 0.4rem 0.75rem;
      color: var(--mauve);
      font-size: 0.74rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      text-decoration: none;
      white-space: nowrap;
      transition: color var(--speed);
    }
    /* A thin gold line grows under the link on hover */
    .menu a::after {
      content: "";
      position: absolute;
      left: 0.75rem;
      right: 0.75rem;
      bottom: 0.1rem;
      height: 1px;
      background: var(--gold);
      transform: scaleX(0);
      transition: transform var(--speed) var(--ease);
    }
    .menu a:hover { color: var(--ink); }
    .menu a:hover::after { transform: scaleX(1); }
    /* aria-current="page" marks the link of the page you're on */
    .menu a[aria-current="page"] { color: var(--ink); }
    .menu a[aria-current="page"]::after { transform: scaleX(1); }

    /* The Menu button only appears on small screens */
    .menu-toggle {
      display: none;
      font: inherit;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      background: none;
      color: var(--ink);
      border: 1px solid var(--ink);
      padding: 0.45rem 1rem;
      cursor: pointer;
    }

    @media (max-width: 1000px) {
      .menu-toggle { display: block; }
      .nav-inner { flex-wrap: wrap; }
      .menu {
        display: none;               /* closed by default on phones */
        flex-direction: column;
        width: 100%;
        padding: 0.5rem 0;
      }
      .menu a { padding: 0.7rem 0; }
      .menu a::after { left: 0; right: auto; width: 40px; }
      .menu.is-open { display: flex; animation: fadeUp 0.3s var(--ease); }
    }

    /* =========================================================
       HEADER BANNER (changes title on each page)
       ========================================================= */
    .banner {
      position: relative;
      background:
        radial-gradient(ellipse at 15% 0%, rgba(255, 158, 196, 0.45), transparent 55%),
        radial-gradient(ellipse at 90% 100%, rgba(227, 201, 154, 0.30), transparent 50%),
        linear-gradient(135deg, var(--ink), var(--berry) 55%, var(--rose-deep));
      color: var(--ivory);
      padding: clamp(3.5rem, 9vw, 6rem) 1.25rem clamp(5.5rem, 11vw, 8rem);
      text-align: center;
    }
    /* Decorative ornament above the title */
    .banner::before {
      content: "✦";
      display: block;
      color: var(--gold-soft);
      font-size: 0.85rem;
      letter-spacing: 1rem;
      margin-bottom: 1.25rem;
    }
    .banner h1 {
      margin: 0;
      color: var(--ivory);
      font-size: clamp(2.4rem, 7vw, 4.5rem);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: 0.02em;
    }
    .banner p {
      margin: 1.25rem auto 0;
      max-width: 640px;
      color: var(--gold-soft);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      line-height: 1.9;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1120px;
      margin: -3.5rem auto 3rem;   /* pulls the content up over the banner */
      padding: 0 1.25rem;
      position: relative;          /* sits above the banner, not behind it */
      z-index: 1;
    }

    /* Pages: only one is visible at a time */
    .page[hidden] { display: none; }
    .page { animation: fadeUp 0.6s var(--ease); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* =========================================================
       SHARED BUILDING BLOCKS
       ========================================================= */
    .card {
      background: var(--paper);
      border: var(--hairline);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(1.5rem, 5vw, 3rem);
      margin-bottom: 1.5rem;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
    .grid-2 > .card { margin-bottom: 0; }

    ol, ul { padding-left: 1.2rem; }
    li::marker { color: var(--gold); }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--sans);
      font-size: 0.74rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      border: 1px solid var(--ink);
      border-radius: 0;
      padding: 0.85rem 1.5rem;
      cursor: pointer;
      background: transparent;
      color: var(--ink);
      text-decoration: none;
      transition: background var(--speed) var(--ease), color var(--speed) var(--ease), border-color var(--speed);
    }
    .btn:hover { background: var(--ink); color: var(--ivory); }
    .btn-primary { background: var(--ink); color: var(--ivory); }
    .btn-primary:hover { background: var(--rose-deep); border-color: var(--rose-deep); }
    .btn[aria-pressed="true"] { background: var(--ink); color: var(--ivory); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.75rem; }

    .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; list-style: none; padding: 0; margin: 0.5rem 0 0; }
    .chips li {
      border: 1px solid var(--gold-soft);
      padding: 0.3rem 0.9rem;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: var(--ink);
    }

    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
    .card-head > div { flex: 1 1 240px; }

    /* =========================================================
       PAGE: HOME
       ========================================================= */
    .explore {
      display: grid;
      grid-template-columns: repeat(3, 1fr);   /* 6 cards = a neat 3 × 2 grid */
      gap: 1px;                         /* 1px gaps show the border colour = fine grid lines */
      background: var(--blush-2);
      border: var(--hairline);
    }
    .explore a {
      display: block;
      background: var(--paper);
      padding: 2rem 1.75rem;
      color: var(--ink);
      text-decoration: none;
      transition: background var(--speed) var(--ease);
    }
    .explore a:hover { background: var(--blush); }
    .explore .num { font-family: var(--serif); font-style: italic; color: var(--gold); font-size: 1.1rem; }
    .explore strong { display: block; font-family: var(--serif); font-weight: 500; font-size: 1.6rem; margin: 0.4rem 0 0.3rem; }
    .explore span.muted { display: block; font-size: 0.9rem; }
    @media (max-width: 860px) { .explore { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 520px) { .explore { grid-template-columns: 1fr; } }
    .explore .arrow { display: inline-block; margin-top: 0.75rem; color: var(--rose-deep); transition: transform var(--speed) var(--ease); }
    .explore a:hover .arrow { transform: translateX(6px); }

    /* =========================================================
       PAGE: ABOUT ME
       ========================================================= */
    .profile { display: flex; gap: 2.5rem; align-items: center; flex-wrap: wrap; }
    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      flex-shrink: 0;
      background: linear-gradient(145deg, var(--rose), var(--rose-deep));
      color: var(--paper);
      display: grid;
      place-items: center;
      font-family: var(--serif);
      font-size: 3rem;
      font-weight: 400;
      font-style: italic;
      border: 1px solid var(--gold-soft);
      box-shadow: 0 0 0 8px var(--paper), 0 0 0 9px var(--gold-soft);
      object-fit: cover;
    }
    img.avatar { width: 190px; height: 190px; }   /* a real photo is shown a little bigger */
    .profile > div { flex: 1 1 280px; }

    .timeline { list-style: none; margin: 0; padding: 0 0 0 1.5rem; border-left: 1px solid var(--gold-soft); }
    .timeline li { position: relative; padding-bottom: 1.5rem; }
    .timeline li::before {
      content: "";
      position: absolute;
      left: calc(-1.5rem - 4px);
      top: 0.55rem;
      width: 7px;
      height: 7px;
      transform: rotate(45deg);          /* a small diamond */
      background: var(--gold);
    }
    .timeline .when { font-size: 0.72rem; color: var(--gold); letter-spacing: 0.18em; text-transform: uppercase; }
    .timeline .what { font-family: var(--serif); font-size: 1.3rem; font-weight: 500; line-height: 1.25; margin: 0.15rem 0; }
    .timeline p { margin: 0.2rem 0 0; color: var(--mauve); font-size: 0.95rem; }
    .timeline .points { list-style: none; padding: 0; margin: 0.4rem 0 0; }
    .timeline .points li { padding: 0 0 0.15rem 1rem; position: relative; font-size: 0.92rem; color: var(--mauve); }
    .timeline .points li::before { content: "–"; position: absolute; left: 0; top: 0; width: auto; height: auto; background: none; transform: none; color: var(--gold); }

    /* Grading bars on the course page */
    .grade + .grade { margin-top: 1.5rem; }
    .grade-top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
    .grade-pct { font-family: var(--serif); font-size: 1.8rem; color: var(--rose-deep); }
    .grade-bar { height: 2px; background: var(--blush-2); margin-top: 0.4rem; }
    .grade-bar span { display: block; height: 100%; background: var(--gold); }
    .grade p { margin: 0.4rem 0 0; font-size: 0.92rem; }

    /* Guest speaker cards ("people" section) */
    .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 1.5rem; }
    .person { text-align: center; padding: 1.5rem 1rem; }
    .person .avatar { width: 96px; height: 96px; font-size: 2.2rem; margin: 0 auto 1.25rem; box-shadow: 0 0 0 5px var(--paper), 0 0 0 6px var(--gold-soft); }
    .person strong { display: block; font-family: var(--serif); font-size: 1.5rem; font-weight: 500; }
    .person span { color: var(--gold); font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; }
    .person p { font-size: 0.92rem; color: var(--mauve); margin: 0.9rem 0 1.1rem; line-height: 1.6; }
    .person img.avatar { width: 120px; height: 120px; }
    .person .btn { padding: 0.6rem 1.1rem; }

    /* Photo gallery + lightbox */
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
    .gallery figure { margin: 0; }
    .gallery-open {
      display: block;
      width: 100%;
      padding: 0;
      border: 1px solid var(--blush-2);
      background: none;
      cursor: zoom-in;
      overflow: hidden;
    }
    .gallery-open img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      transition: transform 0.8s var(--ease);
    }
    .gallery-open:hover img { transform: scale(1.04); }
    .gallery figcaption { margin-top: 0.7rem; font-family: var(--serif); font-style: italic; font-size: 1.1rem; color: var(--mauve); }

    .lightbox {
      border: 1px solid var(--gold);
      padding: 1rem;
      max-width: min(1100px, 94vw);
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .lightbox::backdrop { background: rgba(74, 15, 44, 0.75); backdrop-filter: blur(4px); }
    .lightbox img { display: block; max-width: 100%; max-height: 78vh; margin: 0 auto; }
    .lightbox-close { float: right; margin-bottom: 0.75rem; }
    .lightbox-caption { clear: both; margin: 0.75rem 0 0; text-align: center; font-family: var(--serif); font-style: italic; font-size: 1.15rem; color: var(--mauve); }

    /* =========================================================
       PAGE: SCHEDULE
       ========================================================= */
    .schedule { list-style: none; margin: 0; padding: 0; border-top: var(--hairline); }
    .schedule li {
      display: grid;
      grid-template-columns: 130px 1fr auto;
      gap: 1.5rem;
      align-items: center;
      padding: 1.4rem 0;
      border-bottom: var(--hairline);
      transition: background var(--speed);
    }
    .schedule li:hover { background: linear-gradient(90deg, transparent, var(--blush), transparent); }
    .schedule .date { font-family: var(--serif); font-size: 1.25rem; font-style: italic; color: var(--rose-deep); }
    .schedule .title { font-family: var(--serif); font-size: 1.4rem; font-weight: 500; color: var(--ink); text-decoration: none; }
    .schedule .title:hover { color: var(--rose-deep); }
    .schedule .speaker { color: var(--mauve); font-size: 0.88rem; }
    .status {
      font-size: 0.66rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      padding: 0.3rem 0.8rem;
      color: var(--mauve);
      border: 1px solid var(--blush-2);
      white-space: nowrap;
    }
    .done .status { color: var(--gold); border-color: var(--gold-soft); }
    .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
    @media (max-width: 560px) {
      .schedule li { grid-template-columns: 1fr; gap: 0.3rem; }
    }

    /* =========================================================
       SUB-TABS (Sessions + Games)
       ========================================================= */
    .tablist {
      display: flex;
      gap: 0;
      overflow-x: auto;
      background: var(--paper);
      border: var(--hairline);
      box-shadow: var(--shadow);
    }
    .tab {
      flex: 1 0 auto;
      position: relative;
      border: none;
      border-right: var(--hairline);
      background: none;
      color: var(--mauve);
      font-family: var(--sans);
      font-size: 0.72rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      padding: 1.1rem 1.4rem;
      cursor: pointer;
      transition: color var(--speed), background var(--speed);
    }
    .tab:last-child { border-right: none; }

    /* The two big tabs on the Sessions page */
    .group-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;                          /* 1px gap = a fine dividing line */
      background: var(--blush-2);
      border: var(--hairline);
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }
    .group-tab {
      text-align: left;
      border: none;
      background: var(--paper);
      color: var(--ink);
      padding: clamp(1.1rem, 3vw, 1.6rem) clamp(1.1rem, 3vw, 1.8rem);
      cursor: pointer;
      transition: background var(--speed) var(--ease), color var(--speed);
    }
    .group-tab:hover { background: var(--blush); }
    .group-name { display: block; font-family: var(--serif); font-size: clamp(1.5rem, 4vw, 2.1rem); line-height: 1.1; }
    .group-note { display: block; margin-top: 0.4rem; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--mauve); }
    .group-tab[aria-selected="true"] { background: linear-gradient(135deg, var(--ink), var(--berry)); color: var(--ivory); }
    .group-tab[aria-selected="true"] .group-note { color: var(--gold-soft); }
    @media (max-width: 520px) { .group-tabs { grid-template-columns: 1fr; } }
    .tab:hover { color: var(--ink); background: var(--ivory); }
    .tab::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 2px;
      background: var(--gold);
      transform: scaleX(0);
      transition: transform var(--speed) var(--ease);
    }
    .tab[aria-selected="true"] { color: var(--ink); font-weight: 500; }
    .tab[aria-selected="true"]::after { transform: scaleX(1); }
    .tab .tab-soon { font-size: 0.9em; color: var(--rose); text-transform: none; letter-spacing: 0.05em; font-style: italic; }
    .panel { margin-top: 1.5rem; animation: fadeUp 0.5s var(--ease); }
    .panel[hidden] { display: none; }

    /* Lecture section: expandable cards */
    .concepts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1px; background: var(--blush-2); border: var(--hairline); }
    .concept { background: var(--paper); transition: background var(--speed); }
    .concept:hover { background: var(--ivory); }
    .concept-toggle {
      width: 100%;
      font-family: var(--serif);
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--ink);
      text-align: left;
      background: none;
      border: none;
      padding: 1.2rem 1.4rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      line-height: 1.3;
    }
    .concept-toggle .icon { color: var(--gold); font-family: var(--sans); font-weight: 300; transition: transform var(--speed) var(--ease); flex-shrink: 0; }
    .concept-toggle[aria-expanded="true"] .icon { transform: rotate(45deg); }
    .concept-body { padding: 0 1.4rem 1.3rem; color: var(--mauve); font-size: 0.93rem; }
    .concept-body[hidden] { display: none; }
    .concept-body:not([hidden]) { animation: fadeUp 0.35s var(--ease); }
    .concept-body strong { color: var(--ink); }

    /* Lecture section: stats */
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1px; background: var(--blush-2); border: var(--hairline); }
    .stat { background: linear-gradient(180deg, var(--paper), var(--blush)); padding: 1.6rem 1.4rem; }
    .stat-number { font-family: var(--serif); font-size: 2.6rem; font-weight: 400; color: var(--rose-deep); line-height: 1; font-variant-numeric: lining-nums tabular-nums; }

// Creates an HTML element with an optional class and text
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

// Creates a white card with an optional title and intro line
function makeCard(title, intro) {
  const card = el("section", "card");
  if (title) card.append(el("h3", "", title));
  if (intro) card.append(el("p", "card-intro", intro));
  return card;
}

// Creates a link that looks like a button
function linkButton(text, href, primary, newTab) {
  const a = el("a", primary ? "btn btn-primary" : "btn", text);
  a.href = href;
  if (newTab) { a.target = "_blank"; a.rel = "noopener"; }
  return a;
}

// Creates <ul class="chips"> from an array of words
function chips(words) {
  const ul = el("ul", "chips");
  words.forEach(w => ul.append(el("li", "", w)));
  return ul;
}

// "2026-10-03" → "3 Oct 2026"; "" → "Date TBC"
function formatDate(iso) {
  if (!iso) return "Date TBC";
  return new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}

// Shows a small pop-up message at the bottom of the screen for 2 seconds
function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove("show"), 2000);
}

/* ---- "cards": click to open/close ---- */
function renderCards(section) {
  const card = makeCard(section.title, section.intro);

  // Header row: titles on the left, "Open all" button on the right
  const head = el("div", "card-head");
  const titles = el("div");
  titles.append(...card.childNodes);
  const allBtn = el("button", "btn", "Open all");
  allBtn.setAttribute("aria-pressed", "false");
  head.append(titles, allBtn);
  card.append(head);

  const grid = el("div", "concepts");
  const toggles = [];

  section.items.forEach((item, i) => {
    const box = el("div", "concept");
    const toggle = el("button", "concept-toggle");
    toggle.setAttribute("aria-expanded", "false");
    toggle.append(el("span", "", (i + 1) + ". " + item.name), el("span", "icon", "+"));

    const body = el("div", "concept-body");
    body.hidden = true;
    // section.label (optional) is a bold word shown before the detail, e.g. "Example: "
    if (section.label) body.append(el("strong", "", section.label));
    body.append(document.createTextNode(item.detail));

    // EVENT LISTENER: clicking a card flips it open/closed.
    // aria-expanded tells screen readers whether it's open.
    toggle.addEventListener("click", () => {
      const isOpen = toggle.getAttribute("aria-expanded") === "true";
      toggle.setAttribute("aria-expanded", String(!isOpen));
      body.hidden = isOpen;
    });

    box.append(toggle, body);
    grid.append(box);
    toggles.push(toggle);
  });

  allBtn.addEventListener("click", () => {
    const openAll = allBtn.getAttribute("aria-pressed") === "false";
    toggles.forEach(t => {
      t.setAttribute("aria-expanded", String(openAll));
      t.nextElementSibling.hidden = !openAll;
    });
    allBtn.setAttribute("aria-pressed", String(openAll));
    allBtn.textContent = openAll ? "Close all" : "Open all";
  });

  card.append(grid);
  return card;
}

/* ---- "stats": numbers that count up ---- */
function renderStats(section) {
  const card = makeCard(section.title, section.intro);
  const grid = el("div", "stats");

  section.items.forEach(item => {
    const box = el("div", "stat");
    const number = el("div", "stat-number");
    // Save the stat on the element so countUp() can find it later
    number.dataset.value = item.value;
    number.dataset.decimals = item.decimals || 0;
    number.dataset.prefix = item.prefix || "";
    number.dataset.suffix = item.suffix || "";
    number.textContent = formatStat(item.value, item);
    box.append(number, el("div", "stat-label", item.label));
    if (item.note) box.append(el("div", "stat-note", item.note));
    grid.append(box);
  });

  card.append(grid);
  return card;
}

function formatStat(n, opts) {
  const d = Number(opts.decimals || 0);
  // toLocaleString adds thousands separators: 15505 → "15,505"
  const number = Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  return (opts.prefix || "") + number + (opts.suffix || "");
}

// Animates every .stat-number inside an element from 0 to its value
function countUp(container) {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  container.querySelectorAll(".stat-number").forEach(node => {
    const d = node.dataset;
    const target = Number(d.value);
    const start = performance.now();
    const duration = 900;  // milliseconds

    // requestAnimationFrame runs this function on every screen refresh
    function frame(now) {
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);   // slows down at the end
      node.textContent = formatStat(target * eased,
        { prefix: d.prefix, suffix: d.suffix, decimals: Number(d.decimals) });
      if (progress < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

/* ---- "compare": Before / After switch ---- */
function renderCompare(section) {
  const card = makeCard(section.title, section.intro);

  const switcher = el("div", "switch");
  switcher.setAttribute("role", "group");
  switcher.setAttribute("aria-label", "Choose a view");
  const list = el("ul", "compare-list");
  list.setAttribute("aria-live", "polite");

  // Redraws the list for "before" or "after"
  function show(view) {
    list.innerHTML = "";
    list.className = "compare-list " + view;
    section.items.forEach((item, i) => {
      const li = el("li");
      li.style.animationDelay = i * 60 + "ms";   // items appear one after another
      li.append(el("span", "", item.topic), document.createTextNode(item[view]));
      list.append(li);
    });
    buttons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  }

  const buttons = ["before", "after"].map((view, i) => {
    const b = el("button", "btn", section.labels[i]);
    b.dataset.view = view;
    // EVENT LISTENER: each switch button shows its view
    b.addEventListener("click", () => show(view));
    switcher.append(b);
    return b;
  });

  card.append(switcher, list);
  show("before");
  return card;
}

/* ---- "analysis": your own writing ---- */
function renderAnalysis(section) {
  const card = makeCard(section.title);
  section.blocks.forEach(block => {
    const wrap = el("div", "analysis-block");
    wrap.append(el("h4", "", block.heading));
    if (block.text.length) {
      block.text.forEach(paragraph => wrap.append(el("p", "", paragraph)));
    } else {
      // Nothing written yet: show the guiding question in a dashed box
      wrap.append(el("div", "placeholder", "" + block.prompt));
    }
    card.append(wrap);
  });
  return card;
}

/* ---- "quote": highlighted takeaway ---- */
function renderQuote(section) {
  const card = el("section", "card quote");
  card.append(el("span", "eyebrow", "Key takeaway"), el("p", "", section.text));
  return card;
}

/* ---- "people": guest speaker cards ---- */
function renderPeople(section) {
  const card = makeCard(section.title, section.intro);
  const grid = el("div", "people");
  section.items.forEach(person => {
    const box = el("div", "person");
    // A photo if there is one, otherwise a circle with their first initial
    let avatar;
    if (person.photo) {
      avatar = el("img", "avatar");
      avatar.src = person.photo;
      avatar.alt = "Photo of " + person.name;
      avatar.loading = "lazy";
    } else {
      avatar = el("div", "avatar", person.name.charAt(0));
      avatar.setAttribute("aria-hidden", "true");
    }
    box.append(avatar, el("strong", "", person.name), el("span", "", person.role));
    if (person.description) box.append(el("p", "", person.description));
    if (person.linkedin) {
      const link = linkButton("LinkedIn", person.linkedin, false, true);
      link.setAttribute("aria-label", person.name + " on LinkedIn (opens in a new tab)");
      box.append(link);
    }
    grid.append(box);
  });
  card.append(grid);
  return card;
}

/* ---- "gallery": photos that open bigger when clicked ----
   One shared <dialog> element is used as the "lightbox".
   dialog.showModal() opens it on top of the page; Esc or the
   close button closes it, and focus returns to the photo. */
function renderGallery(section) {
  const card = makeCard(section.title, section.intro);
  const grid = el("div", "gallery");
  section.items.forEach(item => {
    const figure = el("figure");
    const button = el("button", "gallery-open");
    button.setAttribute("aria-label", "Enlarge photo: " + item.caption);
    const img = el("img");
    img.src = item.src;
    img.alt = item.alt;
    img.loading = "lazy";
    button.append(img);
    // EVENT LISTENER: clicking a photo opens it in the lightbox
    button.addEventListener("click", () => openLightbox(item));
    figure.append(button, el("figcaption", "", item.caption));
    grid.append(figure);
  });
  card.append(grid);
  return card;
}

function openLightbox(item) {
  let dialog = document.getElementById("lightbox");
  if (!dialog) {                     // build it the first time it's needed
    dialog = el("dialog", "lightbox");
    dialog.id = "lightbox";
    const close = el("button", "btn lightbox-close", "Close");
    close.addEventListener("click", () => dialog.close());
    // Clicking the dark area around the photo also closes it
    dialog.addEventListener("click", (event) => { if (event.target === dialog) dialog.close(); });
    dialog.append(close, el("img"), el("p", "lightbox-caption"));
    document.body.append(dialog);
  }
  const img = dialog.querySelector("img");
  img.src = item.src;
  img.alt = item.alt;
  dialog.querySelector(".lightbox-caption").textContent = item.caption;
  dialog.showModal();
}

  gallery: renderGallery,

};

/* ---------- Schedule ---------- */
function buildSchedule(page) {
  const card = makeCard("All sessions", "In date order. Click a session to read my analysis.");

  // Filter buttons: All / Done / Upcoming
  const filters = el("div", "filters");
  filters.setAttribute("role", "group");
  filters.setAttribute("aria-label", "Filter sessions");
  const list = el("ol", "schedule");
  const today = new Date().toISOString().slice(0, 10);   // "YYYY-MM-DD"

  // A session is "done" if its date is today or in the past
  // Sort by date (sessions without a date go last), but remember each
  // session's position in SESSIONS so the link opens the right tab
  const ordered = SESSIONS
    .map((s, index) => ({ s, index }))
    .sort((a, b) => (a.s.date || "9999").localeCompare(b.s.date || "9999"));

  const rows = ordered.map(({ s, index }) => {
    const done = s.date !== "" && s.date <= today;
    const li = el("li", done ? "done" : "");
    const info = el("div");
    const titleLink = el("a", "title", s.title);
    titleLink.href = "#lectures/" + (index + 1);    // opens that lecture's tab
    info.append(titleLink, el("div", "speaker", s.tabLabel + " · " + s.speaker));
    li.append(el("div", "date", formatDate(s.date)), info,
              el("span", "status", done ? "Done" : s.date ? "Upcoming" : "TBC"));
    list.append(li);
    return { li, done };
  });

  const buttons = [["all", "All"], ["done", "Done"], ["upcoming", "Upcoming"]].map(([key, label]) => {
    const b = el("button", "btn", label);
    b.setAttribute("aria-pressed", String(key === "all"));   // "All" starts selected
    // EVENT LISTENER: show only the rows that match the filter
    b.addEventListener("click", () => {
      rows.forEach(r => {
        r.li.hidden = (key === "done" && !r.done) || (key === "upcoming" && r.done);
      });
      buttons.forEach(other => other.setAttribute("aria-pressed", String(other === b)));
    });
    filters.append(b);
    return b;
  });

  card.append(filters, list);
  page.append(card);
}

/* ---------- Reusable sub-tabs ----------
   Used by both the Sessions page and the Games page.
   How the sub-tabs work:
   1. One <button role="tab"> and one panel per entry.
   2. Clicking a tab changes the URL to "#<page>/<number>", and the
      navigation code (section 10) then calls select(index).
   3. select() sets aria-selected on that tab and removes "hidden"
      from its panel; the other panels get "hidden".
   4. Arrow keys / Home / End move between tabs.
   options = { page, hashName, label, entries, tabLabel(entry), isSoon(entry), render(panel, entry), onSelect(panel),
               idPrefix (optional: keeps ids unique when a page has two tab sets),
               hashNumber(entry, index) (optional: the number written in the URL, default index + 1) } */
function createTabSet(options) {
  const tabs = [];
  const panels = [];
  const tablist = el("div", "tablist");
  tablist.setAttribute("role", "tablist");
  tablist.setAttribute("aria-label", options.label);
  const panelsBox = el("div");
  options.page.append(tablist, panelsBox);

  const prefix = options.idPrefix || options.hashName;
  const hashNumber = options.hashNumber || ((entry, index) => index + 1);

  options.entries.forEach((entry, index) => {
    const id = prefix + "-" + index;                // e.g. "games-0"
    const tab = el("button", "tab", options.tabLabel(entry));
    tab.id = "tab-" + id;
    tab.setAttribute("role", "tab");
    tab.setAttribute("aria-controls", "panel-" + id);
    if (options.isSoon && options.isSoon(entry)) tab.append(el("span", "tab-soon", " · soon"));
    // EVENT LISTENER: clicking the tab updates the URL, which opens the panel
    tab.addEventListener("click", () => { location.hash = options.hashName + "/" + hashNumber(entry, index); });
    tablist.append(tab);
    tabs.push(tab);

    const panel = el("div", "panel");
    panel.id = "panel-" + id;
    panel.setAttribute("role", "tabpanel");
    panel.setAttribute("aria-labelledby", tab.id);
    panelsBox.append(panel);
    panels.push(panel);
    options.render(panel, entry);
  });

  tablist.addEventListener("keydown", (event) => {
    const current = tabs.indexOf(document.activeElement);
    if (current === -1) return;
    let next = null;
    if (event.key === "ArrowRight") next = (current + 1) % tabs.length;
    if (event.key === "ArrowLeft")  next = (current - 1 + tabs.length) % tabs.length;
    if (event.key === "Home") next = 0;
    if (event.key === "End")  next = tabs.length - 1;
    if (next !== null) {
      event.preventDefault();
      location.hash = options.hashName + "/" + hashNumber(options.entries[next], next);
      tabs[next].focus();
    }
  });

  return {
    count: tabs.length,
    select(index) {
      tabs.forEach((tab, i) => {
        const isActive = i === index;
        tab.setAttribute("aria-selected", String(isActive));
        tab.tabIndex = isActive ? 0 : -1;   // only the active tab is in the Tab-key order
        panels[i].hidden = !isActive;
      });
      if (options.onSelect) options.onSelect(panels[index]);
    }
  };
}

// Pages that have sub-tabs register them here, e.g. TABSETS.lectures
const TABSETS = {};

/* ---------- Sessions page: two big tabs (Lectures / Guest lectures) ----------
   Level 1: one big tab per SESSION_GROUPS entry.
   Level 2: inside each group, a normal row of session tabs (createTabSet).
   The URL always uses the session's position in SESSIONS, so
   "#lectures/3" opens Session 2 wherever it is: Schedule and Games
   links keep working. select() works out which group to show. */
function buildLectures(page) {
  const groupBar = el("div", "group-tabs");
  groupBar.setAttribute("role", "tablist");
  groupBar.setAttribute("aria-label", "Type of session");
  page.append(groupBar);

  const groups = SESSION_GROUPS.map(group => {
    const entries = SESSIONS.filter(s => s.kind === group.kind);

    // The big tab
    const tab = el("button", "group-tab");
    tab.id = "group-tab-" + group.kind;
    tab.setAttribute("role", "tab");
    tab.setAttribute("aria-controls", "group-" + group.kind);
    const done = entries.filter(s => s.data).length;
    tab.append(
      el("span", "group-name", group.label),
      el("span", "group-note", group.note + " · " + done + " of " + entries.length + " written up")
    );
    // EVENT LISTENER: opening a group shows its first session
    tab.addEventListener("click", () => { location.hash = "lectures/" + (SESSIONS.indexOf(entries[0]) + 1); });
    groupBar.append(tab);

    // The group's own area, with its row of session tabs inside
    const area = el("div", "group-panel");
    area.id = "group-" + group.kind;
    area.setAttribute("role", "tabpanel");
    area.setAttribute("aria-labelledby", tab.id);
    page.append(area);

    const tabSet = createTabSet({
      page: area,
      hashName: "lectures",
      idPrefix: "lectures-" + group.kind,
      label: group.label,
      entries,
      hashNumber: s => SESSIONS.indexOf(s) + 1,
      tabLabel: s => s.tabLabel,
      isSoon: s => !s.data,
      render: (panel, s) => s.data ? renderLecture(panel, s) : renderComingSoon(panel, s),
      onSelect: panel => countUp(panel)        // replay the number animation
    });
    return { tab, area, entries, tabSet };
  });

  // Arrow keys move between the two big tabs
  groupBar.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
    event.preventDefault();
    const current = groups.findIndex(g => g.tab === document.activeElement);
    const next = groups[(current + 1) % groups.length];
    location.hash = "lectures/" + (SESSIONS.indexOf(next.entries[0]) + 1);
    next.tab.focus();
  });

  TABSETS.lectures = {
    count: SESSIONS.length,
    // "#lectures" on its own opens the first group's first session
    defaultIndex: SESSIONS.indexOf(groups[0].entries[0]),
    select(index) {
      const session = SESSIONS[index];
      groups.forEach(g => {
        const isActive = g.entries.includes(session);
        g.tab.setAttribute("aria-selected", String(isActive));
        g.tab.tabIndex = isActive ? 0 : -1;
        g.area.hidden = !isActive;
        if (isActive) g.tabSet.select(g.entries.indexOf(session));
      });
    }
  };
}

// Shuffles a copy of an array (Fisher–Yates shuffle)
function shuffle(array) {
  const copy = array.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

/* ---------- The game engine ----------
   createGame() works for ANY game object from section 5.

   STATE: each game keeps its own "state" object, so you can switch
   tabs and come back without losing your progress.
     state.round       → which round we're on (0, 1, 2…)
     state.question    → which question inside that round
     state.score       → total points so far
     state.roundScores → points per round (for the final screen)
     state.answered    → true once the current question is answered
                         (stops double-clicking for extra points)
     state.order       → the shuffled questions of each round

   SCREEN FLOW: start → round intro → questions → next round → … → results */
function createGame(panel, game) {
  // The sessions this theme draws on (each one only once)
  const sessions = [...new Set(game.rounds.map(r => r.session))];
  const maxScore = game.rounds.reduce((sum, r) => sum + r.questions.length, 0);
  let state;

  // Puts everything back to the beginning (used by Start and Play again)
  function resetState() {
    state = {
      round: 0,
      question: 0,
      score: 0,
      roundScores: game.rounds.map(() => 0),
      answered: false,
      order: game.rounds.map(r => shuffle(r.questions))   // new order on each play
    };
  }

  // Each screen starts with one fresh white card
  function newScreen(extraClass) {
    panel.innerHTML = "";
    const card = el("section", "card game" + (extraClass ? " " + extraClass : ""));
    panel.append(card);
    return card;
  }

  // Moves keyboard focus to the heading so screen readers announce the new screen
  function focusHeading(heading) {
    heading.tabIndex = -1;
    heading.focus({ preventScroll: true });
  }

  /* ----- Screen: Start ----- */
  function renderStart() {
    const card = newScreen();
    card.append(
      el("span", "eyebrow", "Theme · " + game.rounds.length + " rounds · " + maxScore + " questions"),
      el("h2", "", game.tabLabel),
      el("p", "muted", game.intro)
    );
    // Each round, with the session it comes from
    const list = el("ol", "round-list");
    game.rounds.forEach(r => {
      const li = el("li", "", r.title);
      li.append(el("span", "round-source", r.session.tabLabel));
      list.append(li);
    });
    card.append(list);

    const row = el("div", "btn-row");
    const startBtn = el("button", "btn btn-primary", "Start the game ▶");
    // EVENT LISTENER: Start resets the state and opens round 1
    startBtn.addEventListener("click", () => { resetState(); renderRoundIntro(); });
    row.append(startBtn);
    // One "revise" link per session used in this theme
    sessions.forEach(s => row.append(linkButton("Revise " + s.tabLabel, "#lectures/" + (SESSIONS.indexOf(s) + 1))));
    card.append(row);
  }

  /* ----- Screen: Round intro ----- */
  function renderRoundIntro() {
    const card = newScreen();
    const round = game.rounds[state.round];
    const isBonus = round.type === "text";
    const heading = el("h2", "", round.title);
    const count = round.questions.length;
    card.append(
      el("span", "eyebrow", (isBonus ? "Bonus" : "Round " + (state.round + 1)) + " · from " + round.session.tabLabel),
      heading,
      el("p", "muted", round.instructions),
      el("p", "", count + (count === 1 ? " question" : " questions") + " · Score so far: " + state.score)
    );
    const goBtn = el("button", "btn btn-primary", "Let's go");
    goBtn.addEventListener("click", renderQuestion);
    card.append(goBtn);
    focusHeading(heading);
  }

  /* ----- Screen: One question ----- */
  function renderQuestion() {
    const card = newScreen();
    state.answered = false;
    const round = game.rounds[state.round];
    const q = state.order[state.round][state.question];

    // Top bar: round + question number, and the score
    const top = el("div", "game-top");
    const scorePill = el("span", "score-pill", "Score: " + state.score);
    top.append(el("span", "eyebrow", round.title + " · " + (state.question + 1) + "/" + round.questions.length), scorePill);
    card.append(top);

    // Progress bar through the whole game
    const done = game.rounds.slice(0, state.round).reduce((s, r) => s + r.questions.length, 0) + state.question;
    const progress = el("div", "progress");
    const bar = el("span");
    bar.style.width = (done / maxScore) * 100 + "%";
    progress.append(bar);
    card.append(progress);

    const heading = el("h3", "", q.prompt);
    card.append(heading);
    if (round.type === "higherLower") {
      card.append(el("p", "muted", "Is the real figure higher or lower than…"), el("p", "stat-guess", q.guess));
    }

    // Feedback box: aria-live makes screen readers read it out
    const feedback = el("div", "feedback");
    feedback.setAttribute("aria-live", "polite");

    // "Next" button, hidden until the player answers
    const isLastQ = state.question === round.questions.length - 1;
    const isLastRound = state.round === game.rounds.length - 1;
    const nextBtn = el("button", "btn btn-primary",
      !isLastQ ? "Next question →" : isLastRound ? "See my results " : "Next round →");
    nextBtn.hidden = true;
    nextBtn.addEventListener("click", goNext);

    const ui = { q, feedback, nextBtn, scorePill };

    if (round.type === "text") {
      card.append(textAnswer(ui));
    } else {
      // Work out which answer buttons to show
      let options;
      if (round.type === "match") {
        const wrong = shuffle(round.choices.filter(c => c !== q.answer)).slice(0, 3);
        options = shuffle([q.answer, ...wrong]);
      } else if (round.type === "higherLower") {
        options = ["Higher", "Lower"];
      } else {
        options = round.buckets;      // "sort"
      }

      const box = el("div", options.length === 2 ? "options two-up" : "options");
      const buttons = options.map(value => {
        const btn = el("button", "option", value);
        btn.dataset.value = value;
        // EVENT LISTENER: each answer button checks the answer when clicked
        btn.addEventListener("click", () => checkAnswer(value === q.answer, ui, buttons, btn));
        box.append(btn);
        return btn;
      });
      card.append(box);
    }

    card.append(feedback, nextBtn);
    focusHeading(heading);
  }

  /* ----- Bonus: typed answer ----- */
  function textAnswer(ui) {
    const form = el("form", "text-answer");
    const input = el("input");
    input.type = "text";
    input.placeholder = "Type your answer…";
    input.autocomplete = "off";
    input.setAttribute("aria-label", "Your answer");
    const submit = el("button", "btn btn-primary", "Check");
    submit.type = "submit";
    const hintBtn = el("button", "btn", "Hint");
    hintBtn.type = "button";
    form.append(input, submit, hintBtn);

    hintBtn.addEventListener("click", () => {
      ui.feedback.className = "feedback";
      ui.feedback.textContent = ui.q.hint;
    });

    // EVENT LISTENER: "submit" fires on button click AND on pressing Enter
    form.addEventListener("submit", (event) => {
      event.preventDefault();                     // stop the page from reloading
      if (state.answered || !input.value.trim()) return;
      const guess = input.value.trim().toLowerCase();
      const correct = ui.q.accept.some(word => guess.includes(word));
      input.disabled = submit.disabled = hintBtn.disabled = true;
      checkAnswer(correct, ui, [], null);
    });
    return form;
  }

  /* ----- Checking an answer ----- */
  function checkAnswer(isCorrect, ui, buttons, clicked) {
    if (state.answered) return;     // ignore extra clicks
    state.answered = true;

    if (isCorrect) {
      state.score++;
      state.roundScores[state.round]++;
      ui.scorePill.textContent = "Score: " + state.score;
      ui.scorePill.classList.add("bump");
    }

    // Green for the right answer, red for a wrong pick, faded for the rest
    buttons.forEach(btn => {
      btn.disabled = true;
      if (btn.dataset.value === ui.q.answer) btn.classList.add("is-correct");
      else if (btn === clicked) btn.classList.add("is-wrong");
      else btn.classList.add("is-dimmed");
    });

    ui.feedback.className = "feedback " + (isCorrect ? "good" : "bad");
    ui.feedback.innerHTML = "";
    ui.feedback.append(
      el("strong", "", isCorrect ? "Correct!" : "Not quite. Answer: " + ui.q.answer),
      el("p", "", ui.q.explain)
    );
    ui.nextBtn.hidden = false;
    ui.nextBtn.focus();
  }

  /* ----- Moving forward ----- */
  function goNext() {
    const round = game.rounds[state.round];
    if (state.question < round.questions.length - 1) {
      state.question++;                       // next question, same round
      renderQuestion();
    } else if (state.round < game.rounds.length - 1) {
      state.round++;                          // next round
      state.question = 0;
      renderRoundIntro();
    } else {
      renderResults();                        // game over
    }
  }

  /* ----- Screen: Results ----- */
  function renderResults() {
    const card = newScreen("center");
    const percent = Math.round((state.score / maxScore) * 100);
    const badge = BADGES.find(b => percent >= b.min);

    const heading = el("h2", "", "Game complete!");
    const badgeCircle = el("div", "badge", badge.icon);
    badgeCircle.setAttribute("aria-hidden", "true");
    card.append(
      el("span", "eyebrow", game.tabLabel + " · Results"),
      heading,
      badgeCircle,
      el("p", "badge-name", badge.name),
      el("p", "big-score", state.score + " / " + maxScore),
      el("p", "muted", percent + "% correct")
    );

    const list = el("ul", "round-breakdown");
    game.rounds.forEach((r, i) =>
      list.append(el("li", "", r.title + ": " + state.roundScores[i] + "/" + r.questions.length)));
    card.append(list);

    const takeaway = el("div", "takeaway");
    takeaway.append(el("strong", "", "Key takeaway"), el("p", "", game.takeaway));
    card.append(takeaway);

    const row = el("div", "btn-row");
    row.style.justifyContent = "center";
    const again = el("button", "btn btn-primary", "Play again ↻");
    // EVENT LISTENER: Play again resets the state and goes back to round 1
    again.addEventListener("click", () => { resetState(); renderRoundIntro(); });
    row.append(again);
    const nextGame = GAMES.indexOf(game) + 1;
    if (nextGame < GAMES.length) row.append(linkButton("Next game →", "#games/" + (nextGame + 1)));
    card.append(row);
    focusHeading(heading);
  }

  resetState();
  renderStart();
}

  form.noValidate = true;     // we check the fields ourselves below
  form.innerHTML = `
    <label for="c-name">Your name</label>
    <input id="c-name" name="name" autocomplete="name" required>
    <label for="c-subject">Subject</label>
    <input id="c-subject" name="subject" required>
    <label for="c-message">Message</label>
    <textarea id="c-message" name="message" required></textarea>
    <div class="btn-row"><button class="btn btn-primary" type="submit">Open in my email app </button></div>
    <p class="form-msg" role="status" aria-live="polite"></p>`;

  // EVENT LISTENER: "submit" fires on button click AND on pressing Enter
  form.addEventListener("submit", (event) => {
    event.preventDefault();                     // stop the page from reloading
    const msg = form.querySelector(".form-msg");
    const name = form.querySelector("#c-name").value.trim();
    const subject = form.querySelector("#c-subject").value.trim();
    const message = form.querySelector("#c-message").value.trim();
    if (!name || !subject || !message) {
      msg.textContent = "Please fill in all three fields.";
      return;
    }
    // mailto: link with the subject and message filled in
    const body = message + "\n\n— " + name;
    window.location.href = "mailto:" + PROFILE.email +
      "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
    msg.textContent = "Your email app should open now. Thank you! ";
  });

  formCard.append(form);
  grid.append(details, formCard);
  page.append(grid);
}

function contactItem(icon, label, value) {
  const li = el("li");
  const text = el("div");
  text.append(el("div", "label", label), el("div", "value", value));
  li.append(el("span", "icon", icon), text);
  li.firstChild.setAttribute("aria-hidden", "true");
  return li;
}

/* =================================================================
   10. NAVIGATION (hash routing)
   -----------------------------------------------------------------
   The menu links change the part of the URL after "#", e.g.
   index.html#about. The browser then fires a "hashchange" event,
   and showPage() displays the matching page. Bonus: the browser's
   Back button works, and you can share a link to one page.

   "#lectures/2" opens the Sessions page on SESSIONS[1],
   "#games/3" opens the Games page on its 3rd game.
   ================================================================= */
const menuLinks = document.querySelectorAll(".menu a");
const menu = document.getElementById("menu");
const menuToggle = document.getElementById("menu-toggle");

function showPage() {
  // "#lectures/2" → name = "lectures", sub = "2"
  const [name, sub] = location.hash.slice(1).split("/");
  const pageName = PAGES[name] ? name : "home";

  // Show one page, hide the others
  Object.keys(PAGES).forEach(key => {
    document.getElementById("page-" + key).hidden = key !== pageName;
  });

  // Highlight the current menu link
  menuLinks.forEach(link => {
    if (link.getAttribute("href") === "#" + pageName) link.setAttribute("aria-current", "page");
    else link.removeAttribute("aria-current");
  });

  // Update the banner and the browser tab title
  document.getElementById("banner-title").textContent = PAGES[pageName].title;
  document.getElementById("banner-subtitle").textContent = PAGES[pageName].subtitle;
  document.title = PAGES[pageName].title + " – " + PROFILE.name;

  // Pages with sub-tabs: "#games/2" opens tab number 2
  const tabSet = TABSETS[pageName];
  if (tabSet) {
    const number = parseInt(sub, 10);
    const index = number ? Math.min(Math.max(number - 1, 0), tabSet.count - 1)
                         : (tabSet.defaultIndex || 0);
    tabSet.select(index);
  }

  // Close the phone menu and go back to the top
  menu.classList.remove("is-open");
  menuToggle.setAttribute("aria-expanded", "false");
  window.scrollTo({ top: 0, behavior: "instant" });
}

// EVENT LISTENER: runs every time the URL hash changes
window.addEventListener("hashchange", showPage);

// EVENT LISTENER: the button opens/closes the menu on phones
menuToggle.addEventListener("click", () => {
  const open = menu.classList.toggle("is-open");
  menuToggle.setAttribute("aria-expanded", String(open));
});
