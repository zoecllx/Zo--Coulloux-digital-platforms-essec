<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Platforms Test Drive – Zoé Coulloux</title>

  <!-- Fonts: an elegant serif for headings, a refined sans-serif for text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@1,700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- =========================================================
       CSS
       All colours and fonts live in :root as CSS variables, so
       the whole look can be changed in one place.
       ========================================================= -->
  <style>
    :root {
      /* --- Luxury pink palette --- */
      --ivory:     #fdf1f5;   /* page background: soft blush pink */
      --paper:     #fffafc;   /* cards: pink-tinted white */
      --blush:     #fbe1ea;   /* soft pink tint */
      --blush-2:   #f3c6d6;   /* borders, tracks */
      --rose:      #e58fae;   /* soft pink accent */
      --rose-deep: #c2336a;   /* main accent: raspberry pink */
      --gold:      #b8925a;   /* champagne gold: hairlines, labels */
      --gold-soft: #e3c99a;
      --ink:       #4a0f2c;   /* deep berry: text, banner, buttons */
      --berry:     #7d1c4a;   /* lighter berry for gradients */
      --mauve:     #8a5670;   /* secondary text */
      --white:     #ffffff;

      /* --- Feedback colours (muted, still clear) --- */
      --correct:    #3f7a5f;
      --correct-bg: #eaf3ee;
      --wrong:      #a83e52;
      --wrong-bg:   #f9e9ec;

      /* --- Type --- */
      --title: "Playfair Display", Georgia, serif;   /* titles: Playfair Display, bold italic */
      --signature: "Amoresa", "Playfair Display", Georgia, serif;   /* my name only (fonts/Amoresa.*) */
      --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;   /* numbers, quotes, captions */
      --sans:  "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;   /* all body text */

      /* --- Shape & motion --- */
      --radius: 4px;            /* luxury = crisp, barely rounded corners */
      --hairline: 1px solid var(--blush-2);
      --shadow: 0 1px 2px rgba(122, 28, 74, 0.05), 0 14px 36px rgba(194, 51, 106, 0.08);
      --focus: 0 0 0 2px var(--paper), 0 0 0 4px var(--gold);
      --speed: 0.35s;
      --ease: cubic-bezier(.22, .61, .36, 1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    /* Anything with the "hidden" attribute stays hidden, even if another
       rule gives it display: grid or flex (e.g. the schedule filter) */
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: var(--sans);
      font-weight: 300;
      font-size: 1.02rem;
      background: var(--ivory);
      color: var(--ink);
      line-height: 1.75;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--rose-deep); text-underline-offset: 3px; }
    strong { font-weight: 500; }

    /* Visible keyboard focus on every interactive element */
    :focus-visible { outline: none; box-shadow: var(--focus); }

    /* "Skip to content" link: hidden until a keyboard user presses Tab */
    .skip-link {
      position: absolute;
      left: 1rem;
      top: -3rem;
      background: var(--ink);
      color: var(--ivory);
      padding: 0.5rem 1rem;
      z-index: 20;
      transition: top var(--speed);
    }
    .skip-link:focus { top: 1rem; }

    /* My name, like a signature: Amoresa, loaded from the project's fonts/
       folder. If the file is missing, the browser uses Playfair instead. */
    @font-face {
      font-family: "Amoresa";
      src: url("fonts/Amoresa.woff2") format("woff2"),
           url("fonts/Amoresa.otf") format("opentype");
      font-display: swap;
    }
    .signature { font-family: var(--signature); font-style: normal; font-weight: 400; letter-spacing: 0; }
    h2.signature { font-size: clamp(2.6rem, 6vw, 3.6rem); line-height: 1.1; }
    .brand .signature { font-size: 1.35em; color: var(--ink); font-style: normal; }
    footer .signature { font-size: 1.9em; text-transform: none; letter-spacing: 0; color: var(--ivory); vertical-align: -0.15em; }

    /* Titles: Playfair Display, bold italic (loaded from Google Fonts) */
    h1, h2, h3, h4 { font-family: var(--title); font-weight: 700; font-style: italic; letter-spacing: 0; color: var(--ink); }
    h2 { font-size: clamp(1.9rem, 4.5vw, 2.7rem); margin: 0.5rem 0 0.6rem; line-height: 1.1; }
    h3 { font-size: clamp(1.45rem, 3vw, 1.75rem); margin: 0 0 0.35rem; line-height: 1.2; }
    h4 { font-size: 1.3rem; }

    /* Small-caps label used above headings */
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--gold);
      font-family: var(--sans);
      font-weight: 500;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
    }
    .eyebrow::before { content: ""; width: 28px; height: 1px; background: currentColor; }

    .muted { color: var(--mauve); }
    .card-intro { color: var(--mauve); margin: 0 0 1.5rem; }
    .meta { display: flex; flex-wrap: wrap; gap: 0.4rem 1.75rem; color: var(--mauve); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; }

    /* =========================================================
       MAIN MENU (sticky bar at the top)
       ========================================================= */
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(253, 241, 245, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: var(--hairline);
    }
    .nav-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      font-family: var(--title);
      font-style: italic;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
      letter-spacing: 0.04em;
    }
    .brand span { color: var(--gold); font-style: italic; }

    .menu { display: flex; gap: 0.25rem; list-style: none; margin: 0; padding: 0; }
    .menu a {
      display: block;
      position: relative;
      padding: 0.4rem 0.6rem;
      color: var(--mauve);
      font-size: 0.72rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      text-decoration: none;
      white-space: nowrap;
      transition: color var(--speed);
    }
    /* A thin gold line grows under the link on hover */
    .menu a::after {
      content: "";
      position: absolute;
      left: 0.6rem;
      right: 0.6rem;
      bottom: 0.1rem;
      height: 1px;
      background: var(--gold);
      transform: scaleX(0);
      transition: transform var(--speed) var(--ease);
    }
    .menu a:hover { color: var(--ink); }
    .menu a:hover::after { transform: scaleX(1); }
    /* aria-current="page" marks the link of the page you're on */
    .menu a[aria-current="page"] { color: var(--ink); }
    .menu a[aria-current="page"]::after { transform: scaleX(1); }

    /* The Menu button only appears on small screens */
    .menu-toggle {
      display: none;
      font: inherit;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      background: none;
      color: var(--ink);
      border: 1px solid var(--ink);
      padding: 0.45rem 1rem;
      cursor: pointer;
    }

    /* Below 1100px the 8 links don't fit on one line: show the Menu button instead */
    @media (max-width: 1100px) {
      .menu-toggle { display: block; }
      .nav-inner { flex-wrap: wrap; }
      .menu {
        display: none;               /* closed by default on phones */
        flex-direction: column;
        width: 100%;
        padding: 0.5rem 0;
      }
      .menu a { padding: 0.7rem 0; }
      .menu a::after { left: 0; right: auto; width: 40px; }
      .menu.is-open { display: flex; animation: fadeUp 0.3s var(--ease); }
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* Pages: only one is visible at a time */
    .page[hidden] { display: none; }
    .page { animation: fadeUp 0.6s var(--ease); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* =========================================================
       SHARED BUILDING BLOCKS
       ========================================================= */
    .card {
      background: var(--paper);
      border: var(--hairline);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(1.5rem, 5vw, 3rem);
      margin-bottom: 1.5rem;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
    .grid-2 > .card { margin-bottom: 0; }

    ol, ul { padding-left: 1.2rem; }
    li::marker { color: var(--gold); }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--sans);
      font-size: 0.74rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      border: 1px solid var(--ink);
      border-radius: 0;
      padding: 0.85rem 1.5rem;
      cursor: pointer;
      background: transparent;
      color: var(--ink);
      text-decoration: none;
      transition: background var(--speed) var(--ease), color var(--speed) var(--ease), border-color var(--speed);
    }
    .btn:hover { background: var(--ink); color: var(--ivory); }
    .btn-primary { background: var(--ink); color: var(--ivory); }
    .btn-primary:hover { background: var(--rose-deep); border-color: var(--rose-deep); }
    .btn[aria-pressed="true"] { background: var(--ink); color: var(--ivory); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.75rem; }

    .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; list-style: none; padding: 0; margin: 0.5rem 0 0; }
    .chips li {
      border: 1px solid var(--gold-soft);
      padding: 0.3rem 0.9rem;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: var(--ink);
    }

    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
    .card-head > div { flex: 1 1 240px; }

    /* =========================================================
       PAGE: HOME
       ========================================================= */
    .explore {
      display: grid;
      grid-template-columns: repeat(12, 1fr);   /* 12 small columns: 3 wide cards on top, 4 below */
      background: var(--paper);
      border: var(--hairline);
    }
    .explore a {
      grid-column: span 3;                       /* 4 per row */
      box-shadow: 0 0 0 0.5px var(--blush-2);   /* fine grid lines */
      display: block;
      background: var(--paper);
      padding: 2rem 1.75rem;
      color: var(--ink);
      text-decoration: none;
      transition: background var(--speed) var(--ease);
    }
    .explore a:hover { background: var(--blush); }
    .explore .num { font-family: var(--serif); font-style: italic; color: var(--gold); font-size: 1.1rem; }
    .explore strong { display: block; font-family: var(--serif); font-weight: 500; font-size: 1.6rem; margin: 0.4rem 0 0.3rem; }
    .explore span.muted { display: block; font-size: 0.9rem; }
    .explore a:nth-child(-n+3) { grid-column: span 4; }   /* the first 3 cards: 3 per row */
    @media (max-width: 860px) { .explore a, .explore a:nth-child(-n+3) { grid-column: span 6; } .explore a:last-child { grid-column: span 12; } }
    @media (max-width: 520px) { .explore a, .explore a:nth-child(-n+3), .explore a:last-child { grid-column: span 12; } }
    .explore .arrow { display: inline-block; margin-top: 0.75rem; color: var(--rose-deep); transition: transform var(--speed) var(--ease); }
    .explore a:hover .arrow { transform: translateX(6px); }

    /* =========================================================
       PAGE: ABOUT ME
       ========================================================= */
    .profile { display: flex; gap: 2.5rem; align-items: center; flex-wrap: wrap; }
    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      flex-shrink: 0;
      background: linear-gradient(145deg, var(--rose), var(--rose-deep));
      color: var(--paper);
      display: grid;
      place-items: center;
      font-family: var(--serif);
      font-size: 3rem;
      font-weight: 400;
      font-style: italic;
      border: 1px solid var(--gold-soft);
      box-shadow: 0 0 0 8px var(--paper), 0 0 0 9px var(--gold-soft);
      object-fit: cover;
    }
    img.avatar { width: 190px; height: 190px; }   /* a real photo is shown a little bigger */
    .profile > div { flex: 1 1 280px; }

    .timeline { list-style: none; margin: 0; padding: 0 0 0 1.5rem; border-left: 1px solid var(--gold-soft); }
    .timeline li { position: relative; padding-bottom: 1.5rem; }
    .timeline li::before {
      content: "";
      position: absolute;
      left: calc(-1.5rem - 4px);
      top: 0.55rem;
      width: 7px;
      height: 7px;
      transform: rotate(45deg);          /* a small diamond */
      background: var(--gold);
    }
    .timeline .when { font-size: 0.72rem; color: var(--gold); letter-spacing: 0.18em; text-transform: uppercase; }
    .timeline .what { font-family: var(--serif); font-size: 1.3rem; font-weight: 500; line-height: 1.25; margin: 0.15rem 0; }
    .timeline p { margin: 0.2rem 0 0; color: var(--mauve); font-size: 0.95rem; }
    .timeline .points { list-style: none; padding: 0; margin: 0.4rem 0 0; }
    .timeline .points li { padding: 0 0 0.15rem 1rem; position: relative; font-size: 0.92rem; color: var(--mauve); }
    .timeline .points li::before { content: "–"; position: absolute; left: 0; top: 0; width: auto; height: auto; background: none; transform: none; color: var(--gold); }

    /* Grading bars on the course page */
    .grade + .grade { margin-top: 1.5rem; }
    .grade-top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
    .grade-pct { font-family: var(--serif); font-size: 1.8rem; color: var(--rose-deep); }
    .grade-bar { height: 2px; background: var(--blush-2); margin-top: 0.4rem; }
    .grade-bar span { display: block; height: 100%; background: var(--gold); }
    .grade p { margin: 0.4rem 0 0; font-size: 0.92rem; }

    /* Guest speaker cards ("people" section) */
    .people { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; }   /* auto-fit: cards share the full width */
    .person { text-align: center; padding: 1.5rem 1rem; }
    .person .avatar { width: 96px; height: 96px; font-size: 2.2rem; margin: 0 auto 1.25rem; box-shadow: 0 0 0 5px var(--paper), 0 0 0 6px var(--gold-soft); }
    .person strong { display: block; font-family: var(--serif); font-size: 1.5rem; font-weight: 500; }
    .person span { color: var(--gold); font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; }
    .person p { font-size: 0.92rem; color: var(--mauve); margin: 0.9rem 0 1.1rem; line-height: 1.6; }
    .person img.avatar { width: 120px; height: 120px; }
    .person .btn { padding: 0.6rem 1.1rem; }

    /* "Photos: …" credit line */
    .source-line { margin: 1.25rem 0 0; font-size: 0.78rem; color: var(--mauve); }
    .source-line a { color: var(--rose-deep); }
    .lightbox-caption a { font-family: var(--sans); font-style: normal; font-size: 0.8rem; color: var(--rose-deep); }

    /* Photo gallery + lightbox */
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
    .gallery figure { margin: 0; }
    .gallery-open {
      display: block;
      width: 100%;
      padding: 0;
      border: 1px solid var(--blush-2);
      background: none;
      cursor: zoom-in;
      overflow: hidden;
    }
    .gallery-open img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      transition: transform 0.8s var(--ease);
    }
    .gallery-open:hover img { transform: scale(1.04); }
    .gallery figcaption { margin-top: 0.7rem; font-family: var(--serif); font-style: italic; font-size: 1.1rem; color: var(--mauve); }

    .lightbox {
      border: 1px solid var(--gold);
      padding: 1rem;
      max-width: min(1100px, 94vw);
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .lightbox::backdrop { background: rgba(74, 15, 44, 0.75); backdrop-filter: blur(4px); }
    .lightbox img { display: block; max-width: 100%; max-height: 78vh; margin: 0 auto; }
    .lightbox-close { float: right; margin-bottom: 0.75rem; }
    .lightbox-caption { clear: both; margin: 0.75rem 0 0; text-align: center; font-family: var(--serif); font-style: italic; font-size: 1.15rem; color: var(--mauve); }

    /* "How I built this website" (course page) */
    .build-steps { list-style: none; padding: 0; margin: 0 0 1.5rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    .build-steps li { padding: 1.1rem 1.2rem; border: 1px solid var(--blush-2); border-radius: 10px; background: linear-gradient(180deg, var(--paper), var(--blush)); }
    .build-num { display: block; font-family: var(--serif); font-style: italic; color: var(--gold); font-size: 1.1rem; }
    .build-steps strong { display: block; margin: 0.2rem 0 0.3rem; font-weight: 600; }
    .build-steps p { margin: 0; font-size: 0.9rem; color: var(--mauve); }
    .journey-title { margin: 2rem 0 0.75rem; }
    .design-choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem 2rem; margin-top: 1.25rem; }   /* 4 choices = 2 × 2 */
    @media (max-width: 600px) { .design-choices { grid-template-columns: 1fr; } }
    .design-choices > div { border-left: 1px solid var(--gold); padding: 0.2rem 0 0.2rem 1rem; }
    .design-choices strong { display: block; font-weight: 600; }
    .design-choices p { margin: 0.2rem 0 0; font-size: 0.9rem; color: var(--mauve); }
    .journey { list-style: none; margin: 0 0 1rem; padding: 0 0 0 1.4rem; border-left: 1px solid var(--gold-soft); }
    .journey li { position: relative; padding: 0 0 1.1rem; }
    .journey li::before { content: ""; position: absolute; left: calc(-1.4rem - 4px); top: 0.45rem; width: 7px; height: 7px; transform: rotate(45deg); background: var(--gold); }
    .journey-step { display: block; font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
    .journey q { display: block; margin: 0.15rem 0; font-family: var(--serif); font-style: italic; font-size: 1.15rem; color: var(--ink); }
    .journey p { margin: 0; font-size: 0.88rem; color: var(--mauve); }

    /* Game embedded at the bottom of a guest lecture tab */
    .embedded-game { margin-top: 2rem; }
    .embedded-head { text-align: center; margin-bottom: 1rem; }
    .embedded-head .eyebrow::after { content: ""; width: 28px; height: 1px; background: currentColor; }
    .embedded-head h3 { font-size: clamp(1.6rem, 3.5vw, 2.1rem); margin-top: 0.3rem; }

    /* =========================================================
       PAGE: SCHEDULE
       ========================================================= */
    .schedule { list-style: none; margin: 0; padding: 0; border-top: var(--hairline); }
    .schedule li {
      display: grid;
      grid-template-columns: 130px 1fr auto;
      gap: 1.5rem;
      align-items: center;
      padding: 1.4rem 0;
      border-bottom: var(--hairline);
      transition: background var(--speed);
    }
    .schedule li:hover { background: linear-gradient(90deg, transparent, var(--blush), transparent); }
    .schedule .date { font-family: var(--serif); font-size: 1.25rem; font-style: italic; color: var(--rose-deep); }
    .schedule .title { font-family: var(--serif); font-size: 1.4rem; font-weight: 500; color: var(--ink); text-decoration: none; }
    .schedule .title:hover { color: var(--rose-deep); }
    .schedule .speaker { color: var(--mauve); font-size: 0.88rem; }
    .status {
      font-size: 0.66rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      padding: 0.3rem 0.8rem;
      color: var(--mauve);
      border: 1px solid var(--blush-2);
      white-space: nowrap;
    }
    .done .status { color: var(--gold); border-color: var(--gold-soft); }
    .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
    @media (max-width: 560px) {
      .schedule li { grid-template-columns: 1fr; gap: 0.3rem; }
    }

    /* =========================================================
       SUB-TABS (Sessions + Games)
       ========================================================= */
    .tablist {
      display: flex;
      gap: 0;
      overflow-x: auto;
      background: var(--paper);
      border: var(--hairline);
      box-shadow: var(--shadow);
    }
    .tab {
      flex: 1 0 auto;
      position: relative;
      border: none;
      border-right: var(--hairline);
      background: none;
      color: var(--mauve);
      font-family: var(--sans);
      font-size: 0.72rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      padding: 1.1rem 1.4rem;
      cursor: pointer;
      transition: color var(--speed), background var(--speed);
    }
    .tab:last-child { border-right: none; }

    /* The two big tabs on the Sessions page */
    .group-tabs {
      display: grid;
      grid-template-columns: repeat(var(--groups, 2), 1fr);   /* one column per big tab */
      gap: 1px;                          /* 1px gap = a fine dividing line */
      background: var(--blush-2);
      border: var(--hairline);
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }
    .group-tab {
      text-align: left;
      border: none;
      background: var(--paper);
      color: var(--ink);
      padding: clamp(1.1rem, 3vw, 1.6rem) clamp(1.1rem, 3vw, 1.8rem);
      cursor: pointer;
      transition: background var(--speed) var(--ease), color var(--speed);
    }
    .group-tab:hover { background: var(--blush); }
    .group-name { display: block; font-family: var(--title); font-style: italic; font-weight: 700; font-size: clamp(1.4rem, 3.6vw, 1.9rem); line-height: 1.15; }
    .group-note { display: block; margin-top: 0.4rem; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--mauve); }
    .group-tab[aria-selected="true"] { background: linear-gradient(135deg, var(--ink), var(--berry)); color: var(--ivory); }
    /* Games page: category names in Poppins, like the games themselves */
    #page-games .group-name { font-family: var(--sans); font-style: normal; font-weight: 500; font-size: clamp(1.1rem, 2.6vw, 1.4rem); }
    .group-tab[aria-selected="true"] .group-note { color: var(--gold-soft); }
    @media (max-width: 760px) { .group-tabs { grid-template-columns: repeat(min(var(--groups, 2), 2), 1fr); } }
    @media (max-width: 420px) { .group-tabs { grid-template-columns: 1fr; } }
    .tab:hover { color: var(--ink); background: var(--ivory); }
    .tab::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 2px;
      background: var(--gold);
      transform: scaleX(0);
      transition: transform var(--speed) var(--ease);
    }
    .tab[aria-selected="true"] { color: var(--ink); font-weight: 500; }
    .tab[aria-selected="true"]::after { transform: scaleX(1); }
    .tab .tab-soon { font-size: 0.9em; color: var(--rose); text-transform: none; letter-spacing: 0.05em; font-style: italic; }
    .panel { margin-top: 1.5rem; animation: fadeUp 0.5s var(--ease); }
    .panel[hidden] { display: none; }

    /* Lecture section: expandable cards */
    /* Fine grid lines: each cell draws half a line on every side (box-shadow),
       so empty spaces at the end of the grid stay white instead of pink */
    .concepts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); background: var(--paper); border: var(--hairline); }
    .concept { background: var(--paper); box-shadow: 0 0 0 0.5px var(--blush-2); transition: background var(--speed); }
    .concept:hover { background: var(--ivory); }
    .concept-toggle {
      width: 100%;
      font-family: var(--serif);
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--ink);
      text-align: left;
      background: none;
      border: none;
      padding: 1.2rem 1.4rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      line-height: 1.3;
    }
    .concept-toggle .icon { color: var(--gold); font-family: var(--sans); font-weight: 300; transition: transform var(--speed) var(--ease); flex-shrink: 0; }
    .concept-toggle[aria-expanded="true"] .icon { transform: rotate(45deg); }
    .concept-body { padding: 0 1.4rem 1.3rem; color: var(--mauve); font-size: 0.93rem; }
    .concept-body[hidden] { display: none; }
    .concept-body:not([hidden]) { animation: fadeUp 0.35s var(--ease); }
    .concept-body strong { color: var(--ink); }

    /* Lecture section: stats */
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); background: var(--paper); border: var(--hairline); }
    .stat { background: linear-gradient(180deg, var(--paper), var(--blush)); box-shadow: 0 0 0 0.5px var(--blush-2); padding: 1.6rem 1.4rem; }
    .stat-number { font-family: var(--serif); font-size: 2.6rem; font-weight: 400; color: var(--rose-deep); line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
    .stat-label { font-size: 0.9rem; margin-top: 0.6rem; color: var(--ink); }
    .stat-note  { color: var(--gold); font-size: 0.78rem; margin-top: 0.3rem; letter-spacing: 0.04em; }

    /* Lecture section: before/after switch */
    .switch { display: inline-flex; border: 1px solid var(--ink); }
    .switch .btn { border: none; }
    .compare-list { list-style: none; padding: 0; margin: 1.75rem 0 0; border-top: var(--hairline); }
    .compare-list li {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 1.5rem;
      padding: 1rem 0;
      border-bottom: var(--hairline);
      animation: fadeUp 0.45s var(--ease) both;
    }
    .compare-list li span { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--gold); padding-top: 0.3rem; }
    .compare-list.after li { color: var(--ink); }
    @media (max-width: 560px) { .compare-list li { grid-template-columns: 1fr; gap: 0.2rem; } }

    /* Lecture section: my analysis */
    .analysis-block + .analysis-block { margin-top: 1.75rem; }
    .analysis-block h4 { margin: 0 0 0.4rem; color: var(--rose-deep); }
    .analysis-block p { margin: 0 0 0.6rem; }
    .placeholder {
      border-left: 1px solid var(--gold);
      padding: 0.3rem 0 0.3rem 1.25rem;
      color: var(--mauve);
      font-family: var(--serif);
      font-size: 1.15rem;
      font-style: italic;
    }

    .quote {
      background:
        radial-gradient(ellipse at 100% 0%, rgba(255, 158, 196, 0.4), transparent 60%),
        linear-gradient(135deg, var(--ink), var(--berry));
      border: none;
      color: var(--ivory);
      text-align: center;
    }
    .quote .eyebrow { color: var(--gold-soft); }
    .quote .eyebrow::after { content: ""; width: 28px; height: 1px; background: currentColor; }
    .quote p { font-family: var(--serif); font-style: italic; font-size: clamp(1.5rem, 3.5vw, 2.1rem); line-height: 1.35; max-width: 760px; margin: 1rem auto 0; }

    /* "Coming soon": three gold diamonds gently fading */
    .soon { text-align: center; }
    .soon-dots { display: flex; justify-content: center; gap: 1rem; margin: 2rem 0 0.5rem; }
    .soon-dots span {
      width: 8px; height: 8px;
      transform: rotate(45deg);
      background: var(--gold);
      animation: shimmer 1.8s ease-in-out infinite;
    }
    .soon-dots span:nth-child(2) { animation-delay: 0.3s; }
    .soon-dots span:nth-child(3) { animation-delay: 0.6s; }
    @keyframes shimmer {
      0%, 100% { opacity: 0.2; }
      50%      { opacity: 1; }
    }

    /* =========================================================
       PAGE: GAMES
       ========================================================= */
    .game { min-height: 340px; }
    /* Games: Poppins for titles and questions, easier to read than the script font */
    .game h2, .game h3 { font-family: var(--sans); font-style: normal; font-weight: 500; letter-spacing: 0; line-height: 1.3; }
    .game h2 { font-size: clamp(1.5rem, 3.5vw, 2rem); }
    .game h3 { font-size: clamp(1.15rem, 2.5vw, 1.35rem); }
    .game .score-pill, .game .stat-guess, .game .feedback strong,
    .game .badge-name, .game .big-score, .game .takeaway p {
      font-family: var(--sans);
      font-style: normal;
    }
    .game .score-pill { font-size: 0.95rem; font-weight: 500; }
    .game .feedback strong { font-size: 1.05rem; font-weight: 500; }
    .game .stat-guess, .game .big-score { font-weight: 500; }
    .game .badge-name { font-size: 1.4rem; font-weight: 500; }
    .game .takeaway p { font-size: 1.1rem; font-weight: 400; }
    .game-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .score-pill { font-family: var(--serif); font-size: 1.2rem; font-style: italic; color: var(--rose-deep); }
    .score-pill.bump { animation: bump 0.5s var(--ease); }
    @keyframes bump { 50% { transform: scale(1.15); color: var(--gold); } }

    .progress { height: 1px; background: var(--blush-2); margin-bottom: 2rem; }
    .progress span { display: block; height: 100%; background: var(--gold); transition: width 0.6s var(--ease); }

    .stat-guess { font-family: var(--serif); font-size: clamp(2.4rem, 7vw, 3.4rem); font-weight: 400; color: var(--rose-deep); margin: 0; line-height: 1.1; }

    /* Answer buttons */
    .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.75rem; margin: 1.75rem 0; }
    .option {
      font-family: var(--sans);
      font-size: 0.98rem;
      font-weight: 400;
      text-align: left;
      background: var(--paper);
      color: var(--ink);
      border: 1px solid var(--blush-2);
      padding: 1.05rem 1.25rem;
      cursor: pointer;
      transition: border-color var(--speed), background var(--speed);
    }
    .option:hover:not(:disabled) { border-color: var(--gold); background: var(--ivory); }
    .option:disabled { cursor: default; }
    .option.is-correct { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); }
    .option.is-wrong   { border-color: var(--wrong);   background: var(--wrong-bg); color: var(--wrong); animation: shake 0.35s; }
    .option.is-dimmed  { opacity: 0.45; }
    .options.two-up { grid-template-columns: 1fr 1fr; }
    .options.two-up .option { text-align: center; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.22em; padding: 1.3rem; }
    @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    @media (max-width: 520px) { .options.two-up { grid-template-columns: 1fr; } }

    /* Bonus question */
    .text-answer { display: flex; gap: 0.75rem; flex-wrap: wrap; margin: 1.75rem 0; }
    .text-answer input {
      flex: 1 1 240px;
      font: inherit;
      color: var(--ink);
      background: transparent;
      padding: 0.7rem 0;
      border: none;
      border-bottom: 1px solid var(--ink);
    }
    .text-answer input:focus-visible { box-shadow: none; border-bottom-color: var(--gold); }

    /* Feedback after answering */
    .feedback { border-left: 2px solid; padding: 0.6rem 0 0.6rem 1.25rem; margin-bottom: 1.5rem; animation: fadeUp 0.4s var(--ease); }
    .feedback:empty { display: none; }
    .feedback strong { font-family: var(--serif); font-size: 1.25rem; }
    .feedback.good { border-color: var(--correct); color: var(--correct); }
    .feedback.bad  { border-color: var(--wrong); color: var(--wrong); }
    .feedback p { margin: 0.2rem 0 0; color: var(--mauve); }

    /* Results screen */
    .center { text-align: center; }
    .center .eyebrow::after { content: ""; width: 28px; height: 1px; background: currentColor; }
    .badge {
      width: 150px; height: 150px; margin: 1.5rem auto;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, var(--rose-deep), var(--ink));
      color: var(--gold-soft);
      display: grid; place-items: center;
      font-size: 1.6rem;
      letter-spacing: 0.3rem;
      border: 1px solid var(--gold);
      box-shadow: 0 0 0 8px var(--paper), 0 0 0 9px var(--gold-soft), var(--shadow);
      animation: pop 0.9s var(--ease);
    }
    @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .badge-name { font-family: var(--serif); font-size: 1.9rem; font-style: italic; color: var(--rose-deep); margin: 0.5rem 0 0; }
    .big-score { font-family: var(--serif); font-size: 3.2rem; font-weight: 400; margin: 0; line-height: 1.1; }
    .round-list { padding-left: 1.2rem; }
    .round-list li { padding: 0.2rem 0; }
    .round-source { margin-left: 0.6rem; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--gold); }
    .round-breakdown { list-style: none; padding: 0; margin: 1.5rem auto; max-width: 420px; border-top: var(--hairline); }
    .round-breakdown li { padding: 0.55rem 0; border-bottom: var(--hairline); font-size: 0.9rem; }
    .takeaway { border-top: 1px solid var(--gold-soft); border-bottom: 1px solid var(--gold-soft); padding: 1.5rem 0; margin: 2rem auto; max-width: 620px; }
    .takeaway strong { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.22em; color: var(--gold); font-weight: 500; }
    .takeaway p { margin: 0.5rem 0 0; font-family: var(--serif); font-style: italic; font-size: 1.4rem; line-height: 1.4; }

    /* ---------- Word Game (Wordle style) ---------- */
    .wg-legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1.25rem; font-size: 0.8rem; color: var(--mauve); margin: 0.5rem 0 1.25rem; }
    .wg-legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
    .wg-dot { width: 12px; height: 12px; display: inline-block; }
    .wg-grid { display: grid; gap: 6px; justify-content: center; margin: 0 auto 0.5rem; }
    .wg-row { display: grid; grid-template-columns: repeat(5, clamp(44px, 12vw, 58px)); gap: 6px; }
    .wg-tile {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1.5px solid var(--blush-2);
      background: var(--paper);
      font-family: var(--sans);
      font-size: clamp(1.3rem, 5vw, 1.7rem);
      font-weight: 600;
      color: var(--ink);
      text-transform: uppercase;
      transition: border-color 0.15s;
    }
    .wg-tile { border-radius: 10px; }                     /* rounded, like Pinkle */
    .wg-tile.filled { border-color: var(--mauve); animation: pop-in 0.12s; }
    .wg-tile.win { animation: bounce 0.5s ease; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14px); } 60% { transform: translateY(2px); } }
    @keyframes pop-in { 50% { transform: scale(1.08); } }
    .wg-tile.flip { animation: flip 0.5s ease both; }
    @keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
    /* The three result colours, from my original Pinkle (tiles, keys, legend) */
    .correct { background: #d81b6a !important; border-color: #d81b6a !important; color: var(--white) !important; }
    .present { background: #f59ac0 !important; border-color: #f59ac0 !important; color: #3b1428 !important; }
    .absent  { background: #b49aa7 !important; border-color: #b49aa7 !important; color: var(--white) !important; }
    .wg-row.shake { animation: shake 0.35s; }
    .wg-message { min-height: 1.6em; text-align: center; font-weight: 500; color: var(--rose-deep); margin: 0.5rem 0; }

    /* On-screen keyboard (also used for the Hangman letters) */
    .wg-keyboard { display: grid; gap: 6px; margin-top: 0.5rem; }
    .wg-keyrow { display: flex; justify-content: center; gap: 5px; }
    .wg-key {
      font-family: var(--sans);
      font-size: 0.9rem;
      font-weight: 500;
      min-width: clamp(26px, 8vw, 40px);
      height: 48px;
      padding: 0 0.3rem;
      border: none;
      border-radius: 8px;
      background: #fbd6e4;
      color: #3b1428;
      cursor: pointer;
      transition: background var(--speed), transform 0.1s;
    }
    .wg-key:hover:not(:disabled) { background: var(--blush-2); }
    .wg-key:active { transform: scale(0.95); }
    .wg-key.wide { min-width: clamp(48px, 13vw, 66px); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .wg-key:disabled { cursor: default; }
    .wg-stats { margin: 1rem 0 0; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
    .wg-dot { border-radius: 3px; }

    /* Pinkle title and stats */
    .game h2.pinkle-title { font-weight: 700; font-size: clamp(2rem, 6vw, 2.6rem); }
    .pinkle-title span { color: #d81b6a; }
    .pk-stats { max-width: 380px; margin: 1.5rem auto 0; }
    .pk-numbers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
    .pk-numbers b { display: block; font-size: 1.6rem; font-weight: 600; line-height: 1.1; color: var(--ink); }
    .pk-numbers span { font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mauve); }
    .pk-dist-title { margin: 1.25rem 0 0.4rem; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mauve); }
    .pk-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 0.8rem; }
    .pk-bar-row > span { width: 10px; }
    .pk-bar { background: #b49aa7; color: var(--white); text-align: right; padding: 1px 8px; border-radius: 4px; font-weight: 600; min-width: 24px; }
    .pk-bar.hit { background: #d81b6a; }

    /* ---------- Hangman ---------- */
    .hm-layout { display: grid; grid-template-columns: minmax(120px, 200px) 1fr; gap: 1.5rem 2rem; align-items: center; margin: 1rem 0 1.5rem; }
    .hm-art svg { width: 100%; height: auto; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .hm-base { stroke: var(--gold); stroke-width: 3; }
    .hm-part { stroke: var(--rose-deep); stroke-width: 3; opacity: 0; transition: opacity 0.4s; }
    .hm-part.shown { opacity: 1; }
    .hm-hint { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
    .hm-word { display: flex; flex-wrap: wrap; gap: 6px; margin: 0.8rem 0; }
    .hm-slot {
      width: clamp(22px, 6vw, 34px);
      height: clamp(32px, 8vw, 44px);
      display: grid;
      place-items: end center;
      border-bottom: 2px solid var(--ink);
      font-size: clamp(1.1rem, 4vw, 1.5rem);
      font-weight: 600;
      color: var(--ink);
    }
    .hm-slot.found { animation: pop-in 0.2s; }
    .hm-slot.missed { color: var(--wrong); }
    .hm-gap { width: 16px; }
    .hm-lives { margin: 0; color: var(--mauve); font-size: 0.9rem; }
    .hm-letters { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 0.5rem; }
    .hm-letters .wg-key { width: clamp(30px, 9vw, 42px); }
    @media (max-width: 520px) { .hm-layout { grid-template-columns: 1fr; } .hm-art { max-width: 150px; margin: 0 auto; } }

    /* ---------- Akinator (reverse) ---------- */
    .ak-genie { display: flex; align-items: center; gap: 1rem; margin: 1rem 0 1.5rem; }
    .ak-lamp { width: 64px; height: 64px; flex-shrink: 0; }
    .ak-lamp svg { width: 100%; height: 100%; fill: none; stroke: var(--gold); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; animation: ak-glow 3s ease-in-out infinite; }
    @keyframes ak-glow { 50% { filter: drop-shadow(0 0 6px rgba(184, 146, 90, 0.7)); transform: translateY(-3px); } }
    .ak-bubble {
      position: relative;
      margin: 0;
      padding: 0.8rem 1.1rem;
      background: var(--blush);
      border: 1px solid var(--blush-2);
      border-radius: 14px;
      font-weight: 500;
      color: var(--ink);
    }
    .ak-bubble::before {                       /* little tail pointing at the genie */
      content: "";
      position: absolute;
      left: -7px;
      top: 50%;
      width: 12px;
      height: 12px;
      background: var(--blush);
      border-left: 1px solid var(--blush-2);
      border-bottom: 1px solid var(--blush-2);
      transform: translateY(-50%) rotate(45deg);
    }
    .ak-layout { display: grid; grid-template-columns: minmax(240px, 1fr) 1.5fr; gap: 1.75rem; }
    @media (max-width: 760px) { .ak-layout { grid-template-columns: 1fr; } }
    .ak-label { margin: 0 0 0.5rem; font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
    .ak-questions { display: grid; gap: 6px; margin-bottom: 1.25rem; }
    .ak-q {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      text-align: left;
      font-family: var(--sans);
      font-size: 0.86rem;
      padding: 0.55rem 0.8rem;
      border: 1px solid var(--blush-2);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      transition: border-color var(--speed), background var(--speed);
    }
    .ak-q:hover:not(:disabled) { border-color: #d81b6a; background: var(--blush); }
    .ak-q:disabled { cursor: default; }
    .ak-q.yes { border-color: #d81b6a; }
    .ak-q.no  { opacity: 0.6; }
    .ak-answer { font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .ak-q.yes .ak-answer { color: #d81b6a; }
    .ak-q.no  .ak-answer { color: var(--mauve); }
    .ak-log { margin: 0; padding-left: 1.2rem; font-size: 0.85rem; }
    .ak-log li { padding: 0.2rem 0; }
    .ak-log li span { margin-right: 0.4rem; }
    .ak-log li.yes b { color: #d81b6a; }
    .ak-log li.no b { color: var(--mauve); }
    .ak-board-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
    .ak-info { margin: 0 0 0.5rem; font-size: 0.78rem; color: var(--mauve); }
    .ak-board { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 8px; }
    .ak-card {
      min-height: 64px;
      padding: 0.6rem;
      font-family: var(--sans);
      font-size: 0.82rem;
      font-weight: 500;
      line-height: 1.3;
      border: 1px solid var(--blush-2);
      border-radius: 10px;
      background: linear-gradient(180deg, var(--paper), var(--blush));
      color: var(--ink);
      cursor: pointer;
      transition: opacity var(--speed), transform var(--speed), border-color var(--speed);
    }
    .ak-card:hover { transform: translateY(-2px); border-color: var(--rose); }
    .ak-card.crossed { opacity: 0.32; text-decoration: line-through; }
    .ak-card.wrong-guess { border-color: var(--wrong); }
    .ak-card.secret { opacity: 1; text-decoration: none; background: #d81b6a; border-color: #d81b6a; color: var(--white); }
    /* Guess mode: cards glow gold to show that a click now means "this one!" */
    .guess-mode .ak-card:not(.crossed) { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(184, 146, 90, 0.25); }
    .guess-mode .ak-board-head .ak-label { color: #d81b6a; }

    /* =========================================================
       PAGE: CONTACT
       ========================================================= */
    .contact-list { list-style: none; padding: 0; margin: 0; border-top: var(--hairline); }
    .contact-list li {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 1.1rem 0;
      border-bottom: var(--hairline);
    }
    .contact-list .icon { color: var(--gold); }
    .contact-list .label { font-size: 0.68rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.2em; }
    .contact-list .value { font-family: var(--serif); font-size: 1.25rem; word-break: break-word; }
    .contact-list li > div { flex: 1 1 160px; }

    form label { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--mauve); margin: 1.4rem 0 0.2rem; }
    form input, form textarea {
      width: 100%;
      font: inherit;
      color: var(--ink);
      padding: 0.6rem 0;
      border: none;
      border-bottom: 1px solid var(--blush-2);
      background: transparent;
      transition: border-color var(--speed);
    }
    form input:focus-visible, form textarea:focus-visible { box-shadow: none; border-bottom-color: var(--gold); }
    form textarea { min-height: 120px; resize: vertical; }
    .form-msg { margin-top: 1rem; font-family: var(--serif); font-style: italic; font-size: 1.15rem; color: var(--rose-deep); }

    /* Small pop-up message ("Copied") */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.5rem;
      transform: translate(-50%, 200%);
      background: var(--ink);
      color: var(--ivory);
      padding: 0.8rem 1.6rem;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      border: 1px solid var(--gold);
      transition: transform 0.45s var(--ease);
      z-index: 30;
    }
    .toast.show { transform: translate(-50%, 0); }

    /* ---------- Footer ---------- */
    footer {
      text-align: center;
      padding: 3rem 1.25rem;
      background: linear-gradient(135deg, var(--ink), var(--berry));
      color: var(--gold-soft);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      line-height: 2.2;
    }
    footer::before { content: "✦"; display: block; margin-bottom: 0.75rem; color: var(--gold); }
    footer a { color: var(--ivory); text-decoration: none; border-bottom: 1px solid var(--gold); }


    /* =========================================================
       WELCOME REDESIGN (designed in Claude Design, handed off to Claude Code)
       Softer, cuter pink: Instrument Serif + Figtree, rounded cards.
       Applies to: the menu and footer (every page), the Welcome page,
       the loading screen, the music button and the click sprinkles.
       ========================================================= */
    :root {
      --accent:     oklch(0.55 0.19 358);   /* raspberry (alternatives: strawberry oklch(0.6 0.19 15), bubblegum oklch(0.66 0.17 340)) */
      --bubblegum:  oklch(0.66 0.17 340);
      --wd-bg:      oklch(0.975 0.012 350);
      --wd-load-bg: oklch(0.965 0.02 355);
      --wd-ink:     oklch(0.28 0.09 355);
      --wd-text2:   oklch(0.42 0.07 355);
      --wd-soft:    oklch(0.93 0.045 355);
      --wd-hover:   oklch(0.94 0.035 355);
      --wd-border:  oklch(0.9 0.04 355);
      --wd-butter:  oklch(0.94 0.06 85);
      --wd-butter2: oklch(0.85 0.09 85);
      --wd-display: "Instrument Serif", Georgia, serif;
      --wd-body:    "Figtree", system-ui, sans-serif;
    }
    body { background: var(--wd-bg); overflow-x: clip; }   /* clip: the full-width word lines never cause sideways scroll */

    /* ----- Menu: a floating pill ----- */
    .site-nav { background: transparent; border-bottom: none; backdrop-filter: none; padding: 16px 20px; z-index: 20; }
    .nav-inner {
      max-width: 1180px;
      padding: 8px 8px 8px 24px;
      background: rgba(255, 250, 252, 0.85);
      backdrop-filter: blur(14px);
      border: 1.5px solid var(--wd-border);
      border-radius: 999px;
      box-shadow: 0 6px 20px oklch(0.6 0.15 355 / 0.08);
      font-family: var(--wd-body);
    }
    .brand { display: flex; align-items: baseline; gap: 10px; font-style: normal; color: var(--wd-ink); }
    .brand .signature { font-size: 30px; line-height: 1; }
    .brand .brand-sub { font-family: var(--wd-body); font-style: normal; font-size: 13px; font-weight: 600; color: oklch(0.5 0.07 355); }
    .menu { gap: 0; flex-wrap: nowrap; }
    .menu a {
      padding: 8px 10px;
      border-radius: 999px;
      font-family: var(--wd-body);
      font-size: 13px;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
      color: oklch(0.4 0.08 355);
      transition: background var(--speed), color var(--speed);
    }
    .menu a::after { display: none; }
    .menu a:hover { background: var(--wd-hover); color: var(--wd-ink); }
    .menu a[aria-current="page"] { background: var(--wd-ink); color: #fff; padding: 8px 14px; }
    .menu a.say-hi { background: var(--accent); color: #fff; padding: 8px 14px; }
    .menu a.say-hi[aria-current="page"] { background: var(--wd-ink); }
    .menu-toggle { border: none; border-radius: 999px; background: var(--wd-ink); color: #fff; font-family: var(--wd-body); font-weight: 600; letter-spacing: 0.04em; text-transform: none; font-size: 13px; padding: 10px 18px; }
    @media (max-width: 1100px) {
      .nav-inner:has(.menu.is-open) { border-radius: 28px; padding-bottom: 14px; }   /* the pill opens into a rounded panel */
      .menu.is-open a { padding: 10px 14px; }
    }

    /* ----- Footer ----- */
    footer.site-footer {
      text-align: left;
      background: var(--wd-ink);
      color: oklch(0.9 0.03 355);
      border-radius: 40px 40px 0 0;
      padding: 48px 24px 96px;          /* extra room at the bottom for the music button */
      font-family: var(--wd-body);
      font-size: 14px;
      text-transform: none;
      letter-spacing: 0;
      line-height: 1.6;
    }
    footer.site-footer::before { display: none; }
    .footer-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px; }
    footer .footer-name { font-size: 52px; line-height: 1; color: #fff; vertical-align: 0; }
    .footer-info { display: flex; flex-direction: column; gap: 6px; }
    .footer-links { display: flex; gap: 16px; }
    footer.site-footer a { color: #fff; font-weight: 600; border-bottom: none; }

    /* ----- Welcome page: no banner, wider content ----- */
    body.is-home main { margin-top: 0; max-width: 1180px; padding: 24px 20px 80px; }
    .wd-home { display: flex; flex-direction: column; gap: 28px; font-family: var(--wd-body); color: var(--wd-ink); }
    .wd-home h1, .wd-home h2 { font-family: var(--wd-display); font-weight: 400; font-style: normal; letter-spacing: 0; color: var(--wd-ink); margin: 0; }
    .wd-home em { font-style: italic; color: var(--accent); }
    .wd-home a { text-decoration: none; }

    /* Hero */
    .wd-hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 40px; align-items: center; padding: 40px 0 20px; }
    .wd-hero-text { display: flex; flex-direction: column; gap: 24px; }
    .wd-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .wd-tag { font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; }
    .wd-tag.soft { background: var(--wd-soft); color: oklch(0.4 0.12 355); }
    .wd-tag.outline { background: #fff; border: 1.5px solid var(--wd-border); color: oklch(0.45 0.08 355); }
    .wd-title { font-size: clamp(52px, 7.4vw, 96px); line-height: 0.95; letter-spacing: -0.02em !important; text-wrap: balance; }
    .wd-lead { margin: 0; font-size: 19px; line-height: 1.6; max-width: 520px; color: oklch(0.4 0.07 355); text-wrap: pretty; }
    .wd-btns { display: flex; flex-wrap: wrap; gap: 12px; }
    .wd-btn { display: inline-flex; align-items: center; gap: 10px; padding: 16px 26px; border-radius: 999px; font-weight: 600; font-size: 16px; transition: transform var(--speed), background var(--speed); }
    .wd-btn.ink { background: var(--wd-ink); color: #fff; box-shadow: 0 4px 0 oklch(0.55 0.19 358 / 0.35); }
    .wd-btn.ink:hover { transform: translateY(-2px); color: #fff; }
    .wd-btn.white { background: #fff; border: 1.5px solid oklch(0.88 0.05 355); color: var(--wd-ink); }
    .wd-btn.white:hover { background: oklch(0.95 0.03 355); transform: translateY(-2px) rotate(-1deg); }
    .wd-btn.small { padding: 14px 22px; font-size: 15px; align-self: flex-start; }

    /* Letter tiles, like Pinkle */
    .wd-tiles { display: flex; gap: 3px; }
    .wd-tiles span { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; }
    .wd-tiles.big { gap: 6px; }
    .wd-tiles.big span { width: 38px; height: 38px; border-radius: 10px; font-size: 16px; }
    .wd-tiles .t-accent { background: var(--accent); }
    .wd-tiles .t-butter { background: var(--wd-butter2); color: oklch(0.3 0.07 60); }
    .wd-tiles .t-ink { background: var(--wd-ink); }
    .wd-tiles .t-plum { background: oklch(0.42 0.08 355); }

    /* Portrait in an arch, with bobbing stickers */
    .wd-portrait { position: relative; justify-self: center; width: min(86%, 400px); aspect-ratio: 4 / 5; }
    .wd-arch-bg { position: absolute; inset: 0; border-radius: 200px 200px 32px 32px; background: oklch(0.9 0.06 355); transform: rotate(4deg); }
    .wd-portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 200px 200px 32px 32px; border: 6px solid #fff; box-sizing: border-box; box-shadow: 0 20px 50px oklch(0.5 0.15 355 / 0.18); }
    .wd-sticker { position: absolute; padding: 8px 14px; border-radius: 999px; white-space: nowrap; font-weight: 600; font-size: 14px; box-shadow: 0 6px 16px oklch(0.5 0.15 355 / 0.15); animation: bob 4s ease-in-out infinite; z-index: 1; }
    .wd-sticker.s0 { --r: -8deg; top: 8%; left: -6%; background: #fff; }
    .wd-sticker.s1 { --r: 6deg; top: 40%; right: -2%; background: var(--accent); color: #fff; animation-duration: 5s; animation-delay: 0.6s; box-shadow: 0 6px 16px oklch(0.5 0.15 355 / 0.2); }
    .wd-sticker.s2 { --r: -4deg; bottom: 12%; left: -4%; background: var(--wd-butter); color: oklch(0.35 0.07 60); animation-duration: 4.5s; animation-delay: 1.2s; }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); } 50% { transform: translateY(-6px) rotate(var(--r, 0deg)); } }
    .wd-signature { position: absolute; bottom: -18px; right: 8%; font-size: 46px; color: #fff; text-shadow: 0 2px 12px oklch(0.4 0.15 355 / 0.45); transform: rotate(-6deg); z-index: 1; }

    /* Info bar */
    .wd-info { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 28px; padding: 18px 24px; border-radius: 24px; background: var(--wd-ink); color: oklch(0.95 0.02 355); font-size: 15px; font-weight: 500; text-align: center; }
    .wd-info .sep { color: oklch(0.75 0.12 355); }
    .wd-info .motto { font-family: var(--wd-display); font-style: italic; font-size: 19px; }

    /* Latest guest session */
    .wd-latest { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); border-radius: 32px; overflow: hidden; background: #fffafc; border: 1.5px solid oklch(0.92 0.035 355); }
    .wd-latest > img { width: 100%; height: 100%; min-height: 300px; object-fit: cover; display: block; }
    .wd-latest-text { padding: clamp(28px, 4vw, 48px); display: flex; flex-direction: column; gap: 18px; }
    .wd-latest-text .wd-tag { align-self: flex-start; padding: 6px 12px; }
    .wd-h2 { font-size: clamp(34px, 4vw, 48px); line-height: 1.05; text-wrap: balance; }
    .wd-latest-text p { margin: 0; font-size: 17px; line-height: 1.65; color: oklch(0.4 0.07 355); text-wrap: pretty; }
    .wd-avatars-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 14px; color: oklch(0.45 0.07 355); }
    .wd-avatars { display: flex; }
    .wd-avatars img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; }
    .wd-avatars img + img { margin-left: -12px; }

    /* "Have a little look around" */
    .wd-explore { display: flex; flex-direction: column; gap: 20px; padding-top: 24px; }
    .wd-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 16px; }
    .wd-card { display: flex; flex-direction: column; gap: 10px; padding: 26px; border-radius: 28px; color: var(--wd-ink); min-height: 170px; transition: transform 0.25s; }
    .wd-card:hover { transform: translateY(-4px) rotate(-0.6deg); color: var(--wd-ink); }
    .wd-card .icon { width: 42px; height: 42px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 18px; color: var(--accent); }
    .wd-card strong { font-family: var(--wd-display); font-weight: 400; font-size: 28px; line-height: 1.1; margin-top: auto; }
    .wd-card span.text { font-size: 15px; line-height: 1.5; color: oklch(0.42 0.07 355); }
    .wd-card.tint-0 { background: oklch(0.94 0.04 355); }
    .wd-card.tint-1 { background: oklch(0.94 0.04 40); }
    .wd-card.tint-2 { background: oklch(0.94 0.04 320); }
    .wd-card.games { background: var(--wd-ink); color: #fff; gap: 14px; }
    .wd-card.games:hover { transform: translateY(-4px) rotate(0.6deg); color: #fff; }
    .wd-card.games span.text { color: oklch(0.88 0.03 355); }

    /* Two moving lines of words (full width) */
    .wd-marquee { display: flex; flex-direction: column; gap: 4px; margin: 32px calc(50% - 50vw) 0; padding: 18px 0; }
    .wd-line { overflow: hidden; padding: 6px 0; }
    .wd-line.course { color: var(--wd-ink); }
    .wd-line.me { color: var(--accent); }
    .wd-track { display: flex; width: max-content; animation: marquee-rtl 38s linear infinite; }
    .wd-line.course .wd-track { animation-name: marquee-ltr; }
    .wd-half { display: flex; align-items: center; gap: 28px; padding-right: 28px; flex-shrink: 0; }
    .wd-half .word { font-family: var(--wd-display); font-size: 34px; letter-spacing: 0.01em; white-space: nowrap; }
    .wd-half .word.it { font-style: italic; }
    .wd-half .glyph { font-size: 12px; opacity: 0.55; }
    @keyframes marquee-ltr { from { transform: translateX(-50%); } to { transform: translateX(0); } }
    @keyframes marquee-rtl { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* ----- Music button (bottom right, every page) ----- */
    .wd-music {
      position: fixed; right: 20px; bottom: 20px; z-index: 30;
      display: flex; align-items: center; gap: 8px; padding: 12px 18px;
      border-radius: 999px; border: 1.5px solid var(--wd-border);
      background: rgba(255, 250, 252, 0.92); backdrop-filter: blur(10px);
      color: var(--wd-ink); font-family: var(--wd-body); font-weight: 600; font-size: 14px;
      cursor: pointer; box-shadow: 0 8px 24px oklch(0.5 0.15 355 / 0.15);
      transition: transform var(--speed);
    }
    .wd-music:hover { transform: translateY(-2px); }
    .wd-music .note { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 14px; }
    .wd-music.is-playing { animation: music-shake 260ms infinite; }
    .wd-music.is-playing .note { animation: music-pulse 520ms ease-out infinite; }
    @keyframes music-shake { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-1px, 1px); } 40% { transform: translate(1px, -1px); } 60% { transform: translate(-1px, -1px); } 80% { transform: translate(1px, 1px); } }
    @keyframes music-pulse {
      0%   { transform: scale(1);    box-shadow: 0 0 0 0 oklch(0.55 0.19 358 / 0.55), 0 0 0 0 oklch(0.55 0.19 358 / 0.35); }
      50%  { transform: scale(1.15); box-shadow: 0 0 0 6px oklch(0.55 0.19 358 / 0.25), 0 0 0 12px oklch(0.55 0.19 358 / 0.12); }
      100% { transform: scale(1);    box-shadow: 0 0 0 10px oklch(0.55 0.19 358 / 0), 0 0 0 18px oklch(0.55 0.19 358 / 0); }
    }
    body.intro-open .wd-music { display: none; }

    /* ----- Loading screen: polaroids ----- */
    body.intro-open { overflow: hidden; }
    .wd-intro { position: fixed; inset: 0; z-index: 100; background: var(--wd-load-bg); overflow: hidden; display: grid; place-items: center; font-family: var(--wd-body); }
    .wd-polaroid {
      position: absolute; top: 0; left: 0;
      width: clamp(78px, min(var(--vw, 11vw), var(--vh, 18vh)), var(--max, 160px));
      padding: 8px 8px 38px; background: #fff; border-radius: 6px;
      box-shadow: 0 12px 30px oklch(0.5 0.15 355 / 0.18); opacity: 0;
    }
    .wd-polaroid .pic { aspect-ratio: 1; overflow: hidden; background: linear-gradient(135deg, oklch(0.94 0.04 355), oklch(0.94 0.04 320)); display: grid; place-items: center; color: oklch(0.75 0.1 355); font-size: 22px; }
    .wd-polaroid .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .wd-polaroid .cap { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-family: "Amoresa", serif; font-size: 17px; line-height: 1; color: var(--wd-ink); }
    .wd-intro-center { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 36px 44px; border-radius: 32px; background: rgba(255, 250, 252, 0.9); backdrop-filter: blur(8px); text-align: center; margin: 16px; }
    .wd-intro-center .signature { font-size: clamp(64px, 9vw, 110px); line-height: 0.9; color: var(--wd-ink); }
    .wd-intro-center .course { font-family: var(--wd-display); font-style: italic; font-size: 22px; color: var(--accent); }
    .wd-progress { width: 220px; height: 6px; border-radius: 999px; background: oklch(0.92 0.04 355); overflow: hidden; }
    .wd-progress span { display: block; width: 0%; height: 100%; border-radius: 999px; background: var(--accent); }
    .wd-intro-msg { font-size: 14px; color: oklch(0.45 0.07 355); }
    .wd-enter { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .wd-enter button { padding: 14px 22px; border-radius: 999px; font-family: var(--wd-body); font-weight: 600; font-size: 15px; cursor: pointer; }
    .wd-enter .music { border: none; background: var(--wd-ink); color: #fff; }
    .wd-enter .quiet { border: 1.5px solid oklch(0.88 0.05 355); background: #fff; color: var(--wd-ink); }

    /* =========================================================
       ALL PAGES REDESIGN (designed in Claude Design: "Pages",
       handed off to Claude Code). Same identity as the Welcome
       page: pink tag chips, big Instrument Serif titles with one
       word in italic, rounded tinted cards, pill buttons.
       ========================================================= */
    body { font-family: var(--wd-body); font-weight: 400; color: var(--wd-ink); line-height: 1.6; }
    h1, h2, h3, h4 { font-family: var(--wd-display); font-weight: 400; font-style: normal; letter-spacing: 0; color: inherit; }
    h1 em, h2 em, h3 em { font-style: italic; color: var(--accent); }
    strong { font-weight: 600; }
    a { color: var(--accent); }
    li::marker { color: var(--accent); }
    .muted { color: oklch(0.45 0.07 355); }
    main { max-width: 1180px; padding: 24px 20px 80px; }
    .page { display: flex; flex-direction: column; gap: 28px; }
    .page[hidden] { display: none; }

    /* Rotating soft tints: pink, peach, lilac */
    .tint-0 { background: oklch(0.94 0.04 355); }
    .tint-1 { background: oklch(0.94 0.04 40); }
    .tint-2 { background: oklch(0.94 0.04 320); }

    /* Page header: tag chips + big title */
    .pg-head { display: flex; flex-direction: column; gap: 18px; padding: 32px 0 8px; }
    .wd-hero .pg-head { padding: 0; }
    .pg-title { margin: 0; font-size: clamp(52px, 7vw, 92px); line-height: 0.95; letter-spacing: -0.02em; text-wrap: balance; }
    .pg-intro { display: flex; flex-direction: column; gap: 20px; max-width: 820px; }
    .pg-intro .pg-head { padding-bottom: 0; }
    .pg-lead { margin: 0; font-size: 17px; line-height: 1.65; color: oklch(0.4 0.07 355); max-width: 780px; text-wrap: pretty; }
    .pg-tagline { margin: 0; font-family: var(--wd-display); font-style: italic; font-size: 26px; color: oklch(0.45 0.1 355); }
    .pg-h2 { margin: 0; font-size: clamp(34px, 4vw, 48px); line-height: 1; }
    .pg-section { display: flex; flex-direction: column; gap: 18px; }
    .pg-split { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px; align-items: start; }
    .ab-focus { margin: 0; font-size: 15px; font-weight: 600; color: oklch(0.45 0.08 355); }

    /* Cards: soft white, rounded */
    .card {
      background: #fffafc;
      border: 1.5px solid oklch(0.92 0.035 355);
      border-radius: 32px;
      box-shadow: none;
      padding: clamp(24px, 4vw, 40px);
      margin-bottom: 0;
    }
    .card > h2 { font-size: 40px; line-height: 1; margin: 0 0 14px; }
    .card > h3 { font-size: clamp(30px, 3.6vw, 42px); line-height: 1.05; margin: 0 0 6px; }
    .card-intro { margin: 0 0 18px; font-size: 15px; color: oklch(0.45 0.07 355); }
    .grid-2 { gap: 20px; }

    /* Small pink label chip */
    .eyebrow {
      align-self: flex-start;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--wd-soft);
      color: oklch(0.4 0.12 355);
      font-family: var(--wd-body);
      font-size: 13px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
    }
    .eyebrow::before, .eyebrow::after, .center .eyebrow::after, .embedded-head .eyebrow::after { display: none; }

    /* Pill buttons */
    .btn {
      font-family: var(--wd-body);
      font-size: 15px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
      border-radius: 999px;
      padding: 13px 22px;
      background: #fff;
      border: 1.5px solid oklch(0.88 0.05 355);
      color: var(--wd-ink);
      transition: transform var(--speed), background var(--speed), color var(--speed);
    }
    .btn:hover { background: var(--wd-hover); color: var(--wd-ink); transform: translateY(-2px); }
    .btn-primary, .btn[aria-pressed="true"] { background: var(--wd-ink); border-color: var(--wd-ink); color: #fff; }
    .btn-primary { box-shadow: 0 4px 0 oklch(0.55 0.19 358 / 0.35); }
    .btn-primary:hover, .btn[aria-pressed="true"]:hover { background: var(--wd-ink); color: #fff; }
    .btn-row { gap: 12px; margin-top: 22px; }
    :focus-visible { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--accent); }

    /* Chips: white pills */
    .chips { gap: 8px; margin: 0; }
    .chips li { border: none; background: #fff; padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 600; letter-spacing: 0; line-height: 1.4; color: oklch(0.35 0.09 355); }

    /* ---------- About ---------- */
    .tl-item { display: flex; flex-direction: column; gap: 4px; padding: 16px 0 16px 20px; border-left: 2px dashed oklch(0.88 0.05 355); position: relative; }
    .tl-item::before { content: ""; position: absolute; left: -7px; top: 22px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
    .tl-item.ink::before { background: var(--wd-ink); }
    .tl-when { font-size: 13px; font-weight: 600; color: var(--accent); }
    .tl-what { font-family: var(--wd-display); font-weight: 400; font-size: 24px; line-height: 1.15; }
    .tl-where { font-size: 14px; color: oklch(0.45 0.07 355); }
    .tl-point { font-size: 14px; line-height: 1.5; color: oklch(0.4 0.07 355); }
    .ink-panel { display: flex; flex-direction: column; gap: 16px; padding: clamp(24px, 4vw, 40px); border-radius: 32px; background: var(--wd-ink); color: #fff; }
    .ink-panel h2 { margin: 0; color: #fff; font-size: 40px; line-height: 1; }
    .ink-panel h2 em { color: oklch(0.8 0.1 355); }
    .ink-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px; }
    .ink-tile { display: flex; flex-direction: column; gap: 4px; padding: 18px; border-radius: 20px; background: oklch(0.36 0.1 355); }
    .ink-tile strong { font-size: 15px; }
    .ink-tile span { font-size: 13px; color: oklch(0.85 0.04 355); }
    .chip-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; }
    .chip-card { display: flex; flex-direction: column; gap: 14px; padding: 26px; border-radius: 28px; }
    .chip-card-head { display: flex; align-items: center; gap: 10px; }
    .chip-card-head strong { font-family: var(--wd-display); font-weight: 400; font-size: 28px; line-height: 1.1; }
    .round-icon { width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; background: #fff; display: grid; place-items: center; color: var(--accent); font-weight: 700; }

    /* ---------- Course ---------- */
    .num-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
    .num-tile { display: flex; flex-direction: column; gap: 14px; padding: 24px; border-radius: 28px; min-height: 130px; }
    .num-tile .num { font-family: var(--wd-display); font-size: 34px; line-height: 1; color: var(--accent); }
    .num-tile .txt { margin-top: auto; font-size: 17px; font-weight: 600; line-height: 1.35; }
    .grade + .grade { margin-top: 18px; }
    .grade-top strong { font-size: 16px; }
    .grade-pct { font-family: var(--wd-display); font-size: 32px; line-height: 1; color: var(--accent); }
    .grade-bar { height: 10px; border-radius: 999px; background: oklch(0.93 0.035 355); overflow: hidden; margin-top: 8px; }
    .grade-bar span { background: var(--accent); border-radius: 999px; }
    .grade p { margin: 8px 0 0; font-size: 14px; color: oklch(0.45 0.07 355); }
    .format-title { margin: 28px 0 8px; font-size: 28px; }
    .fmt-item { display: block; font-size: 15px; line-height: 1.5; color: oklch(0.4 0.07 355); padding: 3px 0; }
    .pill-accent { align-self: flex-start; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--accent); color: #fff; }
    .ink-panel > h2 + .prof-sub { margin-top: -6px; }
    .prof-sub { font-size: 14px; color: oklch(0.8 0.1 355); font-weight: 600; }
    .fact { font-size: 15px; line-height: 1.5; color: oklch(0.9 0.03 355); padding: 12px 0; border-bottom: 1px solid oklch(0.4 0.09 355); }
    .fact:last-child { border-bottom: none; }

    /* ---------- Big tabs (Sessions, Games) + small pill tabs ---------- */
    .group-tabs { display: flex; flex-wrap: wrap; gap: 10px; background: none; border: none; box-shadow: none; margin: -10px 0 0; }
    .group-tab { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px 22px; border-radius: 22px; border: 1.5px solid var(--wd-border); background: #fff; color: var(--wd-ink); font-family: var(--wd-body); transition: background var(--speed); }
    .group-tab:hover { background: var(--wd-hover); }
    .group-tab[aria-selected="true"] { background: var(--wd-ink); color: #fff; }
    .group-name { font-family: var(--wd-body); font-style: normal; font-weight: 700; font-size: 16px; line-height: 1.3; }
    .group-note, .group-tab[aria-selected="true"] .group-note { margin-top: 0; font-size: 13px; text-transform: none; letter-spacing: 0; color: inherit; opacity: 0.8; }
    #page-games .group-tabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
    #page-games .group-tab { padding: 16px 20px; }
    #page-games .group-name { font-family: var(--wd-display); font-weight: 400; font-size: 26px; line-height: 1.1; }
    .tablist { display: flex; flex-wrap: wrap; gap: 8px; overflow: visible; background: none; border: none; box-shadow: none; margin-top: 16px; }
    .tab, .tab:last-child { flex: 0 0 auto; border: 1.5px solid var(--wd-border); border-radius: 999px; background: #fff; color: var(--wd-ink); font-family: var(--wd-body); font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; padding: 10px 18px; }
    .tab::after { display: none; }
    .tab:hover { background: var(--wd-hover); color: var(--wd-ink); }
    .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .tab .tab-soon { color: inherit; opacity: 0.75; font-style: normal; letter-spacing: 0; }
    .panel { margin-top: 24px; display: flex; flex-direction: column; gap: 28px; }
    .panel[hidden] { display: none; }

    /* ---------- Sessions: lecture header + sections ---------- */
    .lecture-head { display: flex; flex-direction: column; gap: 14px; padding: clamp(26px, 4vw, 44px); }
    .card.lecture-head > h2 { margin: 0; font-size: clamp(34px, 4.4vw, 54px); line-height: 1.02; text-wrap: balance; }
    .lecture-speaker { font-size: 15px; font-weight: 600; color: oklch(0.45 0.08 355); }
    .lecture-head .btn-row { margin-top: 4px; }
    .soon-note { margin: 0; font-family: var(--wd-display); font-style: italic; font-size: 24px; color: var(--accent); }
    .soon-dots { justify-content: flex-start; margin: 0; }
    .soon-dots span { transform: none; border-radius: 50%; background: var(--accent); }
    .card.lecture-sec { background: none; border: none; border-radius: 0; padding: 0; }
    .lecture-sec > h3, .lecture-sec .card-head h3 { font-size: clamp(30px, 3.6vw, 42px); line-height: 1.05; margin: 0 0 6px; }
    .lecture-sec .card-intro { margin-bottom: 16px; }
    .card-head { align-items: center; margin-bottom: 4px; }

    .concepts { grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; align-items: start; background: none; border: none; }
    .concept { border-radius: 24px; box-shadow: none; }
    .concept:nth-child(3n+1), .person:nth-child(3n+1) { background: oklch(0.94 0.04 355); }
    .concept:nth-child(3n+2), .person:nth-child(3n+2) { background: oklch(0.94 0.04 40); }
    .concept:nth-child(3n),   .person:nth-child(3n)   { background: oklch(0.94 0.04 320); }
    .concept-toggle { font-family: var(--wd-body); font-size: 16px; font-weight: 600; line-height: 1.35; padding: 20px 22px; align-items: center; color: var(--wd-ink); border-radius: 24px; }
    .concept-toggle .icon { width: 30px; height: 30px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-family: var(--wd-body); font-size: 18px; font-weight: 400; color: var(--accent); }
    .concept-body { padding: 0 22px 20px; font-size: 15px; line-height: 1.55; color: oklch(0.4 0.07 355); }

    .stats { grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 12px; background: none; border: none; }
    .stat { display: flex; flex-direction: column; gap: 6px; padding: 22px; border-radius: 24px; background: #fff; border: 1.5px solid oklch(0.92 0.035 355); box-shadow: none; }
    .stat-number { font-family: var(--wd-display); font-size: 44px; color: var(--accent); }
    .stat-label { margin-top: 0; font-size: 15px; font-weight: 600; line-height: 1.35; }
    .stat-note { margin-top: 0; font-size: 13px; letter-spacing: 0; color: oklch(0.5 0.06 355); }

    .compare-box { display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: 28px; background: oklch(0.94 0.04 40); }
    .switch { align-self: flex-start; gap: 4px; padding: 4px; border-radius: 999px; background: #fff; border: none; }
    .switch .btn { border: none; padding: 10px 18px; font-size: 14px; background: transparent; box-shadow: none; }
    .switch .btn:hover { transform: none; background: var(--wd-hover); }
    .switch .btn[aria-pressed="true"] { background: var(--wd-ink); color: #fff; }
    .switch .btn[data-view="after"][aria-pressed="true"] { background: var(--accent); }
    .compare-list { margin: 0; border: none; display: flex; flex-direction: column; gap: 10px; }
    .compare-list li { grid-template-columns: minmax(110px, 180px) minmax(0, 1fr); gap: 16px; padding: 14px 16px; border-radius: 18px; background: #fff; border: none; font-size: 15px; line-height: 1.5; }
    .compare-list li span { padding-top: 0; font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--accent); }

    .people { grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 14px; }
    .person { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 26px; border-radius: 28px; }
    .person .avatar, .person img.avatar { width: 96px; height: 96px; margin: 0; border: 4px solid #fff; box-shadow: none; }
    .person strong { font-family: var(--wd-display); font-weight: 400; font-size: 26px; line-height: 1.1; }
    .person span { font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--accent); }
    .person p { margin: 0; font-size: 14px; line-height: 1.5; color: oklch(0.4 0.07 355); }
    .person .btn { margin-top: auto; padding: 10px 18px; font-size: 14px; background: var(--wd-ink); border-color: var(--wd-ink); color: #fff; }
    .source-line { margin-top: 14px; font-size: 13px; color: oklch(0.45 0.07 355); }

    .gallery { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; }
    .gallery figure { padding: 10px 10px 16px; border-radius: 24px; background: #fff; box-shadow: 0 10px 30px oklch(0.5 0.15 355 / 0.1); }
    .gallery-open { border: none; border-radius: 16px; }
    .gallery figcaption { margin-top: 10px; padding: 0 6px; font-family: var(--signature); font-style: normal; font-size: 22px; line-height: 1.2; color: var(--wd-ink); }
    .lightbox { border: 6px solid #fff; border-radius: 24px; background: #fffafc; padding: 14px; }
    .lightbox::backdrop { background: oklch(0.2 0.06 355 / 0.85); }
    .lightbox img { border-radius: 16px; }
    .lightbox-close { padding: 8px 16px; font-size: 13px; }
    .lightbox-caption { font-family: var(--signature); font-style: normal; font-size: 24px; color: var(--wd-ink); }

    .analysis-block { padding: 22px; border-radius: 24px; background: #fff; border: 1.5px dashed oklch(0.85 0.06 355); }
    .analysis-block + .analysis-block { margin-top: 12px; }
    .analysis-block h4 { font-size: 24px; color: var(--wd-ink); }
    .analysis-block p { font-size: 15px; line-height: 1.6; color: oklch(0.4 0.07 355); }

    .card.quote { background: var(--wd-ink); border: none; color: #fff; padding: clamp(30px, 5vw, 56px); }
    .quote .eyebrow { align-self: center; background: oklch(0.36 0.1 355); color: oklch(0.9 0.03 355); }
    .quote p { font-family: var(--wd-display); font-style: italic; font-size: clamp(26px, 3.4vw, 40px); line-height: 1.2; text-wrap: balance; }

    .embedded-game { margin-top: 8px; }
    .embedded-head { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .embedded-head h3 { margin: 0; font-size: clamp(30px, 4vw, 42px); }

    /* ---------- Games ---------- */
    .pg-head .wd-tiles { margin-bottom: -4px; }
    .game { min-height: 340px; }
    .game h2, .game h3 { font-family: var(--wd-display); font-weight: 400; font-style: normal; }
    .game h2 { font-size: clamp(32px, 4vw, 46px); line-height: 1.05; }
    .game h3 { font-size: clamp(26px, 3vw, 34px); line-height: 1.15; text-wrap: balance; }
    .game .score-pill { font-family: var(--wd-body); font-style: normal; font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 999px; background: var(--wd-ink); color: #fff; }
    @keyframes bump { 50% { transform: scale(1.15); background: var(--accent); } }
    .progress { height: 8px; border-radius: 999px; background: oklch(0.93 0.035 355); overflow: hidden; margin-bottom: 24px; }
    .progress span { background: var(--accent); border-radius: 999px; }
    .game .stat-guess { font-family: var(--wd-display); font-weight: 400; color: var(--accent); }
