/* ---------- Click sprinkles ----------
   Clicking any link or button makes it jiggle and sends 12 little
   sprinkles flying from the cursor. They are removed when they finish. */
const SPRINKLES = ["♡", "♥", "♫", "♪", "🧁", "🎂", "✿", "✦"];
const SPRINKLE_COLOURS = ["var(--accent)", "var(--bubblegum)", "oklch(0.8 0.1 85)", "var(--wd-ink)"];

// EVENT LISTENER: one listener for the whole page
document.addEventListener("click", (event) => {
  if (reduceMotion) return;
  const target = event.target.closest("a, button");
  if (!target) return;
  target.animate([
    { transform: "rotate(0) scale(1)" }, { transform: "rotate(-6deg) scale(1.08)" },
    { transform: "rotate(5deg) scale(1.05)" }, { transform: "rotate(-3deg) scale(1.02)" },
    { transform: "rotate(0) scale(1)" }
  ], { duration: 450, easing: "ease-out" });

  for (let i = 0; i < 12; i++) {
    const s = el("span", "", SPRINKLES[Math.floor(Math.random() * SPRINKLES.length)]);
    s.setAttribute("aria-hidden", "true");
    Object.assign(s.style, {
      position: "fixed", left: event.clientX + "px", top: event.clientY + "px", pointerEvents: "none",
      zIndex: 9999, fontSize: (14 + Math.random() * 12) + "px", color: SPRINKLE_COLOURS[i % 4], lineHeight: 1
    });
    document.body.append(s);
    const angle = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 70;
    const dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist - 30, r = (Math.random() - 0.5) * 120;
    s.animate([
      { transform: "translate(-50%,-50%) scale(0.4)", opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${r}deg) scale(1)`, opacity: 1, offset: 0.6 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy + 40}px)) rotate(${r * 1.5}deg) scale(0.8)`, opacity: 0 }
    ], { duration: 900 + Math.random() * 400, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => s.remove();
  }
});

/* ---------- Loading screen ----------
   18 polaroids pop in around a centre card, each at a random place
   chosen so they overlap the centre card and each other as little as
   possible. When the progress bar is full, two buttons let you in. */
function showIntro() {
  document.body.classList.add("intro-open");
  const intro = el("div", "wd-intro");
  intro.setAttribute("role", "dialog");
  intro.setAttribute("aria-modal", "true");
  intro.setAttribute("aria-label", "Welcome");

  // The polaroids (two sizes, alternating)
  const cards = INTRO_POLAROIDS.map((p, i) => {
    const card = el("div", "wd-polaroid");
    card.setAttribute("aria-hidden", "true");
    if (i % 2) card.style.cssText = "--vw:10.5vw;--vh:17vh;--max:150px";
    else card.style.cssText = "--vw:12vw;--vh:19vh;--max:170px";
    const pic = el("div", "pic");
    if (p.src) { const img = el("img"); img.src = p.src; img.alt = ""; pic.append(img); }
    else pic.textContent = "✿";                          // placeholder until a photo is added
    card.append(pic, el("span", "cap", p.caption));
    intro.append(card);
    return card;
  });

  // The centre card
  const center = el("div", "wd-intro-center");
  const progress = el("div", "wd-progress");
  const bar = el("span");
  progress.append(bar);
  const msg = el("span", "wd-intro-msg", "getting everything pretty…");
  center.append(el("span", "signature", "Zoé"), el("span", "course", "Digital Platforms Test Drive"), progress, msg);
  intro.append(center);
  document.body.append(intro);

  // Place the cards once the browser knows the sizes
  requestAnimationFrame(() => {
    const W = innerWidth, H = innerHeight, placed = [];
    const c = center.getBoundingClientRect();
    const middle = { x: c.left + c.width * 0.2, y: c.top + c.height * 0.2, w: c.width * 0.6, h: c.height * 0.6 };
    const overlap = (a, b) =>
      Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) *
      Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));

    shuffle(cards).forEach((card, i) => {
      const w = card.offsetWidth || 160, hgt = card.offsetHeight || 200;
      // Try 150 random spots, keep the one with the lowest score
      let best = null, bestScore = Infinity;
      for (let t = 0; t < 150; t++) {
        const r = { x: Math.random() * Math.max(1, W - w), y: Math.random() * Math.max(1, H - hgt), w, h: hgt };
        const score = overlap(r, middle) * 4 + placed.reduce((sum, p) => sum + overlap(r, p), 0);
        if (score < bestScore) { best = r; bestScore = score; if (score === 0) break; }
      }
      placed.push(best);
      Object.assign(card.style, { left: best.x + "px", top: best.y + "px", zIndex: 1 + Math.floor(Math.random() * 3) });
      const tilt = "rotate(" + (Math.random() * 24 - 12).toFixed(1) + "deg)";
      card.style.transform = tilt;
      if (reduceMotion) { card.style.opacity = 1; return; }
      // Pop in, one after another
      card.animate([
        { opacity: 0, transform: tilt + " translateY(40px) scale(0.6)" },
        { opacity: 1, transform: tilt + " translateY(-6px) scale(1.05)", offset: 0.7 },
        { opacity: 1, transform: tilt + " scale(1)" }
      ], { duration: 600, delay: 150 + i * 200 + Math.random() * 120, easing: "cubic-bezier(.2,.8,.3,1.2)", fill: "forwards" });
      // Then float forever ("add" = on top of the tilt, not instead of it)
      const dx = (Math.random() * 16 - 8).toFixed(1), dy = (10 + Math.random() * 14).toFixed(1), dr = (Math.random() * 4 - 2).toFixed(1);
      card.animate([
        { transform: "translate(0,0) rotate(0deg)" },
        { transform: "translate(" + dx + "px,-" + dy + "px) rotate(" + dr + "deg)" }
      ], { duration: 2800 + Math.random() * 2200, delay: Math.random() * 1000, iterations: Infinity,
           direction: "alternate", easing: "ease-in-out", composite: "add" });
    });

    // Progress bar, then the two buttons
    const total = reduceMotion ? 600 : 150 + cards.length * 220 + 400;
    bar.animate([{ width: "0%" }, { width: "100%" }], { duration: total, easing: "ease-in-out", fill: "forwards" }).onfinish = () => {
      const enter = el("div", "wd-enter");
      const withMusic = el("button", "music", "Come in with music ♫");
      const quiet = el("button", "quiet", "Come in quietly");
      // EVENT LISTENERS: the click itself is what allows the music to start
      withMusic.addEventListener("click", () => { music.play(); closeIntro(); });
      quiet.addEventListener("click", closeIntro);
      enter.append(withMusic, quiet);
      msg.replaceWith(enter);
      withMusic.focus();
    };
  });

  function closeIntro() {
    intro.animate([{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(1.04)" }],
                  { duration: reduceMotion ? 1 : 600, easing: "ease-in", fill: "forwards" }).onfinish = () => {
      intro.remove();
      document.body.classList.remove("intro-open");
    };
  }
}
